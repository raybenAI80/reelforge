      <main

        data-rf-fragment-version="1.0"

              <h1 class="esh-headline">
                <span class="esh-headline-line" data-slot="headline-one">시선이</span>
                <span class="esh-headline-line esh-headline-line--accent" data-slot="headline-two">머문다</span>
              </h1>
              <p class="esh-detail" data-slot="detail">천천히 방향을 바꾼다</p>
            </div>
            <p class="esh-far-label" data-slot="far-label">먼곳</p>
            <p class="esh-near-label" data-slot="near-label">가까움</p>
          </div>
        </div>
      </main>
      <script>
        (() => {
          const compositionId = "gallery-camera-eye-shift";
          const root = document.querySelector(`[data-composition-id="${compositionId}"]`);
          if (!root) return;

          const stage = root.querySelector(".esh-stage");
          const floor = root.querySelector(".esh-floor");
          const horizon = root.querySelector(".esh-horizon");
          const axis = root.querySelector(".esh-axis");
          const echo = root.querySelector(".esh-echo");
          const kicker = root.querySelector(".esh-kicker");
          const headlineLines = Array.from(root.querySelectorAll(".esh-headline-line"));
          const detail = root.querySelector(".esh-detail");
          const nearLabel = root.querySelector(".esh-near-label");
          const farLabel = root.querySelector(".esh-far-label");
          const origin = { x: 50, y: 50 };
          const applyOrigin = () => {
            stage.style.perspectiveOrigin = `${origin.x}% ${origin.y}%`;
          };

          window.__timelines = window.__timelines || {};
          const tl = gsap.timeline({ paused: true });

          tl.set([floor, horizon, axis, echo, kicker, detail, nearLabel, farLabel, ...headlineLines], { opacity: 0 })
            .set(floor, { scale: 0.94 })
            .set(echo, { x: 74, y: -30 })
            .set(headlineLines, { x: -58, y: 22 })
            .set(detail, { x: -28, y: 14 })
            .set(nearLabel, { x: 54, y: 20 })
            .set(farLabel, { x: 36 })
            .to(floor, { opacity: 0.5, scale: 1, duration: 0.72, ease: "power2.out" }, 0)
            .to(horizon, { opacity: 0.7, duration: 0.46, ease: "power2.out" }, 0.08)
            .to(axis, { opacity: 0.42, duration: 0.46, ease: "power2.out" }, 0.14)
            .to(echo, { opacity: 0.46, x: 0, y: 0, duration: 0.72, ease: "power3.out" }, 0.16)
            .to(kicker, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.3)
            .to(headlineLines[0], { opacity: 1, x: 0, y: 0, duration: 0.48, ease: "power3.out" }, 0.48)
            .to(headlineLines[1], { opacity: 1, x: 0, y: 0, duration: 0.48, ease: "power3.out" }, 0.8)
            .to(detail, { opacity: 1, x: 0, y: 0, duration: 0.38, ease: "power2.out" }, 1.14)
            .to(farLabel, { opacity: 0.72, x: 0, duration: 0.36, ease: "power2.out" }, 1.28)
            .to(nearLabel, { opacity: 1, x: 0, y: 0, duration: 0.46, ease: "power3.out" }, 1.52)
            .to(origin, {
              x: 55,
              y: 67,
              duration: 1.25,
              ease: "power2.inOut",
              onUpdate: applyOrigin
            }, 0.56);

          window.__timelines[compositionId] = tl;
          tl.seek(0);
        })();
      </script>
