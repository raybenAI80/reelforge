        @keyframes lct-breathe {

            filter: blur(136px) brightness(1);

            filter: blur(136px) brightness(1.24);
            opacity: 0.26;
          }
        }
      </style>

      <main
        class="rf-line-chart-trace"
        data-rf-fragment-version="1.0"
        data-composition-id="gallery-data-line-chart-trace"
      >
        <div class="lct-stage">
          <div class="lct-haze" aria-hidden="true"></div>
          <div class="lct-kicker" data-slot="kicker">주간 흐름</div>
          <h1 class="lct-headline" data-slot="headline">흐름이 보이는 순간</h1>
          <p class="lct-detail" data-slot="detail">작은 변화가 방향을 만듭니다</p>

          <div class="lct-chart">
            <svg viewBox="0 0 1440 620" preserveAspectRatio="none" aria-hidden="true">
              <path class="lct-grid" d="M 60 105 H 1385 M 60 245 H 1385 M 60 385 H 1385"></path>
              <path class="lct-grid lct-grid--strong" d="M 60 525 H 1385"></path>
              <path
                class="lct-area"
                data-series="70,475 205,430 360,420 520,340 640,380 810,280 900,315 1080,180 1190,230 1310,100 1370,130"
                d="M 70 475 C 190 430 250 490 360 420 S 540 340 640 380 S 800 280 900 315 S 1080 180 1190 230 S 1310 100 1370 130 L 1370 525 L 70 525 Z"
              ></path>
              <path
                class="lct-line-shadow"
                d="M 70 475 C 190 430 250 490 360 420 S 540 340 640 380 S 800 280 900 315 S 1080 180 1190 230 S 1310 100 1370 130"
              ></path>
              <path
                class="lct-line"
                data-series="70,475 205,430 360,420 520,340 640,380 810,280 900,315 1080,180 1190,230 1310,100 1370,130"
                d="M 70 475 C 190 430 250 490 360 420 S 540 340 640 380 S 800 280 900 315 S 1080 180 1190 230 S 1310 100 1370 130"
              ></path>
              <circle class="lct-lead-marker" cx="70" cy="475" r="13"></circle>
              <g class="lct-final-group">
                <circle class="lct-final-pulse" cx="1370" cy="130" r="38"></circle>
                <circle class="lct-final-dot" cx="1370" cy="130" r="16"></circle>
                <path class="lct-label-leader" d="M 1358 116 L 1267 57"></path>
                <text class="lct-end-value" x="1160" y="55" data-slot="end-value" data-value="68%">68%</text>
                <text class="lct-end-caption" x="1163" y="96" data-slot="end-caption">마감 지점</text>
              </g>
            </svg>

          <div class="lct-axis">
            <span data-slot="axis-start">시작</span>
            <span data-slot="axis-end">현재</span>
          </div>
          <div class="lct-index" data-slot="index">03 / 06</div>

      </main>

      <script>
        (() => {
          const compositionId = "gallery-data-line-chart-trace";
          const root = document.querySelector(`[data-composition-id="${compositionId}"]`);
          if (!root) return;

          const kicker = root.querySelector(".lct-kicker");
          const headline = root.querySelector(".lct-headline");
          const detail = root.querySelector(".lct-detail");
          const chart = root.querySelector(".lct-chart");
          const linePath = root.querySelector(".lct-line");
          const area = root.querySelector(".lct-area");
          const leadMarker = root.querySelector(".lct-lead-marker");
          const finalGroup = root.querySelector(".lct-final-group");
          const axis = root.querySelector(".lct-axis");
          const index = root.querySelector(".lct-index");
          const fallbackStart = { x: 70, y: 475 };
          const fallbackEnd = { x: 1370, y: 130 };
          const fallbackLength = 1500;
          const canMeasureLength = linePath && typeof linePath.getTotalLength === "function";
          const measuredLength = canMeasureLength ? linePath.getTotalLength() : fallbackLength;
          const length = Number.isFinite(measuredLength) && measuredLength > 0 ? measuredLength : fallbackLength;
          const tracer = { distance: 0 };

          const pointAt = (distance, fallback) => {
            if (!linePath || typeof linePath.getPointAtLength !== "function") return fallback;
            const point = linePath.getPointAtLength(Math.max(0, Math.min(length, distance)));
            if (!point || !Number.isFinite(point.x) || !Number.isFinite(point.y)) return fallback;
            return point;
          };

          const updateLeadMarker = () => {
            const point = pointAt(tracer.distance, fallbackStart);
            leadMarker.setAttribute("cx", String(point.x));
            leadMarker.setAttribute("cy", String(point.y));
          };

          const endPoint = pointAt(length, fallbackEnd);
          leadMarker.setAttribute("cx", String(fallbackStart.x));
          leadMarker.setAttribute("cy", String(fallbackStart.y));
          finalGroup.setAttribute("data-end-x", String(endPoint.x));
          finalGroup.setAttribute("data-end-y", String(endPoint.y));

          window.__timelines = window.__timelines || {};
          const tl = gsap.timeline({ paused: true });

          tl.set([kicker, headline, detail, chart, axis, index], { opacity: 0 })
            .set(chart, { y: 28 })
            .set(linePath, { strokeDasharray: length, strokeDashoffset: length })
            .set(area, { clipPath: "inset(0 100% 0 0)" })
            .set(leadMarker, { opacity: 0, scale: 0.35, transformOrigin: "50% 50%" })
            .set(finalGroup, { opacity: 0, scale: 0.76, transformOrigin: "1370px 130px" })
            .fromTo(kicker, { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.26, ease: "power3.out" }, 0)
            .fromTo(headline, { opacity: 0, x: -58 }, { opacity: 1, x: 0, duration: 0.46, ease: "power3.out" }, 0.1)
            .fromTo(detail, { opacity: 0, x: 38 }, { opacity: 1, x: 0, duration: 0.34, ease: "power3.out" }, 0.3)
            .fromTo(chart, { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.36)
            .to(leadMarker, { opacity: 1, scale: 1, duration: 0.18, ease: "back.out(1.7)" }, 0.52)
            .to(linePath, { strokeDashoffset: 0, duration: 1.16, ease: "power2.out" }, 0.54)
            .to(area, { clipPath: "inset(0 0% 0 0)", duration: 1.16, ease: "power2.out" }, 0.54)
            .to(tracer, { distance: length, duration: 1.16, ease: "power2.out", onUpdate: updateLeadMarker }, 0.54)
            .fromTo(axis, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 1.2)
            .fromTo(index, { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, 1.32)
            .to(leadMarker, { opacity: 0, duration: 0.08, ease: "none" }, 1.68)
            .fromTo(finalGroup, { opacity: 0, scale: 0.76 }, { opacity: 1, scale: 1, duration: 0.26, ease: "back.out(1.8)" }, 1.68);

          window.__timelines[compositionId] = tl;
          tl.seek(0);
        })();
      </script>
