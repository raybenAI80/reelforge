<!-- rf-gallery v1 | object/connector-tree-cascade | line-connector-draw | mutate=copy,duration,accent-color | keep=timeline-phase,easing,entry-geometry,connector-stagger,node-pop,label-slide -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Connector Tree Cascade</title>
  </head>
  <body>
    <template>
      <style>
        .rf-connector-tree-cascade {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: var(--rf-bg, #08080b);
          color: var(--rf-text, #ffffff);
          font-family: var(--rf-font-sans, "Pretendard", system-ui, sans-serif);
        }
        .rf-connector-tree-cascade .rf-stage {
          position: absolute;
          inset: 0;
          will-change: transform;
        }
        .rf-connector-tree-cascade .rf-kicker {
          position: absolute;
          top: 5.8%;
          left: 5.8%;
          color: var(--rf-ink-subtle, #8a8f98);
          font-family: var(--rf-font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
          font-size: 20px;
          font-weight: 700;
          letter-spacing: 0.12em;
          line-height: 1;
        }
        .rf-connector-tree-cascade .rf-ghost {
          position: absolute;
          top: 8%;
          right: 5.5%;
          color: var(--rf-bg, #08080b);
          font-size: clamp(300px, 31vw, 600px);
          font-weight: 800;
          letter-spacing: -0.11em;
          line-height: 0.82;
          -webkit-text-stroke: 1px var(--rf-hairline, rgba(255, 255, 255, 0.14));
          opacity: 0.72;
          user-select: none;
        }
        .rf-connector-tree-cascade .rf-copy {
          position: absolute;
          top: 27.3%;
          left: 8.1%;
          z-index: 2;
          font-size: clamp(124px, 9.7vw, 186px);
          font-weight: 800;
          letter-spacing: -0.072em;
          line-height: 0.92;
          white-space: nowrap;
          word-break: keep-all;
        }
        .rf-connector-tree-cascade .rf-copy-line {
          display: block;
          will-change: transform, opacity;
        }
        .rf-connector-tree-cascade .rf-copy-line--second {
          margin-left: 0.82em;
          color: var(--rf-accent-alt, #afa3ff);
        }
        .rf-connector-tree-cascade .rf-equation {
          position: absolute;
          top: 54.5%;
          left: 7.85%;
          z-index: 2;
          color: var(--rf-muted-text, #b4b8c0);
          font-family: var(--rf-font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
          font-size: 18px;
          font-weight: 700;
          letter-spacing: 0.14em;
          line-height: 1;
          will-change: transform, opacity;
        }
        .rf-connector-tree-cascade .rf-equation::before {
          content: "";
          display: inline-block;
          width: 70px;
          height: 1px;
          margin: 0 16px 5px 0;
          background: var(--rf-accent-alt, #afa3ff);
          vertical-align: middle;
        }
        .rf-connector-tree-cascade .rf-tree {
          position: absolute;
          top: 15.5%;
          right: 8.2%;
          bottom: 18%;
          width: 35%;
          z-index: 1;
          opacity: 0.95;
        }
        .rf-connector-tree-cascade .rf-trunk,
        .rf-connector-tree-cascade .rf-branch {
          position: absolute;
          background: var(--rf-hairline-strong, rgba(255, 255, 255, 0.36));
          transform-origin: left center;
          will-change: transform, opacity;
        }
        .rf-connector-tree-cascade .rf-trunk {
          top: 3%;
          bottom: 0;
          left: 9%;
          width: 1px;
          transform-origin: center top;
        }
        .rf-connector-tree-cascade .rf-branch {
          left: 9%;
          width: 18%;
          height: 1px;
        }
        .rf-connector-tree-cascade .rf-branch--a { top: 15%; }
        .rf-connector-tree-cascade .rf-branch--b { top: 38%; width: 31%; }
        .rf-connector-tree-cascade .rf-branch--c { top: 61%; width: 23%; }
        .rf-connector-tree-cascade .rf-branch--d { top: 84%; width: 36%; }
        .rf-connector-tree-cascade .rf-node {
          position: absolute;
          left: 9%;
          width: 9px;
          height: 9px;
          border: 1px solid var(--rf-accent-alt, #afa3ff);
          border-radius: 50%;
          background: var(--rf-bg, #08080b);
          box-sizing: border-box;
          transform: translate(-4px, -4px);
          will-change: opacity, filter;
        }
        .rf-connector-tree-cascade .rf-node--a { top: 15%; }
        .rf-connector-tree-cascade .rf-node--b { top: 38%; }
        .rf-connector-tree-cascade .rf-node--c { top: 61%; }
        .rf-connector-tree-cascade .rf-node--d { top: 84%; }
        .rf-connector-tree-cascade .rf-label {
          position: absolute;
          left: 31%;
          color: var(--rf-text, #ffffff);
          font-family: var(--rf-font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
          font-size: clamp(16px, 1.2vw, 23px);
          font-weight: 700;
          letter-spacing: 0.055em;
          line-height: 1;
          white-space: nowrap;
          will-change: transform, opacity;
        }
        .rf-connector-tree-cascade .rf-label--a { top: 12.6%; }
        .rf-connector-tree-cascade .rf-label--b { top: 35.6%; left: 44%; }
        .rf-connector-tree-cascade .rf-label--c { top: 58.6%; left: 36%; }
        .rf-connector-tree-cascade .rf-label--d { top: 81.6%; left: 49%; }
        .rf-connector-tree-cascade .rf-running {
          position: absolute;
          right: 5.8%;
          bottom: 6.4%;
          display: flex;
          align-items: center;
          gap: 14px;
          color: var(--rf-muted-text, #b4b8c0);
          font-family: var(--rf-font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
          font-size: 15px;
          font-weight: 700;
          letter-spacing: 0.14em;
          line-height: 1;
          will-change: transform, opacity;
        }
        .rf-connector-tree-cascade .rf-running::before {
          content: "";
          width: 148px;
          height: 1px;
          background: var(--rf-hairline, rgba(255, 255, 255, 0.14));
        }
        @keyframes rf-connector-node-breathe {
          from { filter: brightness(1); opacity: 0.5; }
          to { filter: brightness(1.72); opacity: 1; }
        }
        @keyframes rf-connector-copy-breathe {
          from { filter: brightness(1); opacity: 0.76; }
          to { filter: brightness(1.34); opacity: 1; }
        }
        .rf-connector-tree-cascade .rf-node,
        .rf-connector-tree-cascade .rf-label {
          animation: rf-connector-node-breathe 1.25s ease-in-out calc(var(--rf-scene-start, 0s) + 1.2s) infinite alternate;
        }
        .rf-connector-tree-cascade .rf-copy-line--second {
          animation: rf-connector-copy-breathe 1.45s ease-in-out calc(var(--rf-scene-start, 0s) + 1.2s) infinite alternate;
        }
      </style>
      <main
        class="rf-connector-tree-cascade"
        data-rf-fragment-version="1.0"
        data-composition-id="gallery-object-connector-tree-cascade"
      >
        <div class="rf-stage">
          <div class="rf-kicker" data-slot="kicker">SYSTEM MAP</div>
          <div class="rf-ghost" aria-hidden="true">=</div>
          <div class="rf-copy">
            <span class="rf-copy-line" data-slot="headline-primary">BUILD THE</span>
            <span class="rf-copy-line rf-copy-line--second" data-slot="headline-secondary">CONNECTION</span>
          </div>
          <div class="rf-equation" data-slot="equation">INPUT = OUTPUT</div>
          <div class="rf-tree" aria-label="Pipeline structure">
            <div class="rf-trunk"></div>
            <div class="rf-branch rf-branch--a"></div>
            <div class="rf-branch rf-branch--b"></div>
            <div class="rf-branch rf-branch--c"></div>
            <div class="rf-branch rf-branch--d"></div>
            <div class="rf-node rf-node--a"></div>
            <div class="rf-node rf-node--b"></div>
            <div class="rf-node rf-node--c"></div>
            <div class="rf-node rf-node--d"></div>
            <div class="rf-label rf-label--a" data-slot="pipeline-step-1">SOURCE / COLLECT</div>
            <div class="rf-label rf-label--b" data-slot="pipeline-step-2">PROCESS / TRANSFORM</div>
            <div class="rf-label rf-label--c" data-slot="pipeline-step-3">CHECK / VALIDATE</div>
            <div class="rf-label rf-label--d" data-slot="pipeline-step-4">OUTPUT / DELIVER</div>
          </div>
          <div class="rf-running" data-slot="status">STATUS / ACTIVE</div>
        </div>
      </main>
      <script>
        (() => {
          const compositionId = "gallery-object-connector-tree-cascade";
          const root = document.querySelector(`[data-composition-id="${compositionId}"]`);
          if (!root) return;
          const kicker = root.querySelector(".rf-kicker");
          const copy = Array.from(root.querySelectorAll(".rf-copy-line"));
          const equation = root.querySelector(".rf-equation");
          const tree = root.querySelector(".rf-tree");
          const trunk = root.querySelector(".rf-trunk");
          const branches = Array.from(root.querySelectorAll(".rf-branch"));
          const nodes = Array.from(root.querySelectorAll(".rf-node"));
          const labels = Array.from(root.querySelectorAll(".rf-label"));
          const running = root.querySelector(".rf-running");
          window.__timelines = window.__timelines || {};
          const tl = gsap.timeline({ paused: true });

          tl.set([kicker, copy, equation, tree, running], { opacity: 0 })
            .set(copy, { x: -42, y: 20 })
            .set(trunk, { scaleY: 0, transformOrigin: "center top" })
            .set(branches, { scaleX: 0, transformOrigin: "left center" })
            .set(nodes, { opacity: 0, scale: 0.35, transformOrigin: "center center" })
            .set(labels, { opacity: 0, x: -18 })
            .fromTo(kicker, { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.24, ease: "power3.out" }, 0)
            .fromTo(running, { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.24, ease: "power3.out" }, 0)
            .to(copy[0], { opacity: 1, x: 0, y: 0, duration: 0.26, ease: "power4.out" }, 0.04)
            .to(copy[1], { opacity: 1, x: 0, y: 0, duration: 0.26, ease: "power4.out" }, 0.1)
            .to(tree, { opacity: 1, duration: 0.1, ease: "none" }, 0.1)
            .to(trunk, { scaleY: 1, duration: 0.22, ease: "power3.out" }, 0.05)
            .to(branches, { scaleX: 1, duration: 0.13, stagger: 0.035, ease: "power3.out" }, 0.16)
            .to(nodes, { opacity: 1, scale: 1, duration: 0.1, stagger: 0.035, ease: "back.out(2)" }, 0.18)
            .to(labels, { opacity: 1, x: 0, duration: 0.1, stagger: 0.035, ease: "power3.out" }, 0.16)
            .fromTo(equation, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.16, ease: "power3.out" }, 0.24);

          window.__timelines[compositionId] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>
