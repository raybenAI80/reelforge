      <script>
        (() => {
          const compositionId = "gallery-seal-rail-lockup-sweep";
          const root = document.querySelector(`[data-composition-id="${compositionId}"]`);
          if (!root) return;

          const kicker = root.querySelector(".rf-kicker");
          const rail = root.querySelector(".rf-rail");
          const ghost = root.querySelector(".rf-ghost");
          const lines = Array.from(root.querySelectorAll(".rf-line"));
          const underline = root.querySelector(".rf-underline");
          const destination = root.querySelector(".rf-destination");
          const status = root.querySelector(".rf-status");

          window.__timelines = window.__timelines || {};
          const tl = gsap.timeline({ paused: true });

          tl.set([kicker, rail, ghost, lines, underline, destination, status], { opacity: 0 })
            .set(rail, { scaleY: 0, transformOrigin: "center top" })
            .set(underline, { scaleX: 0, transformOrigin: "left center" })
            .fromTo(kicker, { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0)

            .fromTo(ghost, { opacity: 0, x: 110, rotation: 3 }, { opacity: 0.2, x: 0, rotation: 0, duration: 0.9, ease: "power2.out" }, 0.05)
            .fromTo(lines, { opacity: 0, x: -68, y: 15 }, { opacity: 1, x: 0, y: 0, duration: 0.45, stagger: 0.18, ease: "power4.out" }, 0.3)

            .to(underline, { opacity: 1, scaleX: 1, duration: 0.55, ease: "power3.inOut" }, 1.15);

          window.__timelines[compositionId] = tl;
          tl.seek(0);
