      <script>
        (() => {
          const compositionId = "v7s-s11";
          const root = document.querySelector(`[data-composition-id="${compositionId}"]`);
          if (!root) return;

          const beat = 0.375;
          const planeBackground = root.querySelector(".s11-plane--background");
          const planeMid = root.querySelector(".s11-plane--mid");
          const planeForeground = root.querySelector(".s11-plane--foreground");
          const copyFlow = root.querySelector(".s11-copy-flow");
          const ghostOne = root.querySelector(".s11-ghost--one");
          const ghostTwo = root.querySelector(".s11-ghost--two");
          const farRule = root.querySelector(".s11-depth-rule--far");
          const nearRule = root.querySelector(".s11-depth-rule--near");
          const depthTags = root.querySelectorAll(".s11-depth-tag");
          const farCopy = root.querySelector(".s11-copy-plane--far");
          const nearCopy = root.querySelector(".s11-copy-plane--near");
          const heroes = root.querySelectorAll(".s11-hero");
          const subline = root.querySelector(".s11-subline");
          const microCluster = root.querySelector(".s11-micro-cluster");
          const chrome = root.querySelector(".s11-chrome");
          const progress = root.querySelector(".s11-progress");
          const marker = root.querySelector(".s11-progress-marker");
          const camera = { x: -156 };
          const planes = [
            { el: planeBackground, factor: 0.15 },
            { el: planeMid, factor: 0.45 },
            { el: planeForeground, factor: 1.0 }
          ];
          const applyCamera = () => {
            planes.forEach(({ el, factor }) => {
              el.style.transform = `translate3d(${camera.x * factor}px, 0, 0)`;
            });
          };

          window.__timelines = window.__timelines || {};
          const tl = gsap.timeline({ paused: true });

          applyCamera();
          tl.set(camera, { x: -156, onUpdate: applyCamera }, 0)
            .set(heroes, { opacity: 0.34, filter: "blur(10px)" }, 0)
            .set(farCopy, { x: 78, y: 18, scaleX: 0.95, transformOrigin: "left 100%" }, 0)
            .set(nearCopy, { x: -76, y: -16, scaleX: 1.05, transformOrigin: "left 100%" }, 0)
            .set([chrome, subline, microCluster, progress], { opacity: 0 }, 0)
            .set(marker, { opacity: 0, scaleY: 0.3 }, 0)
            .set([farRule, nearRule, depthTags], { opacity: 0 }, 0)
            .set(copyFlow, { x: -42, opacity: 0.04 }, 0)
            .set(ghostOne, { x: -84, opacity: 0.12 }, 0)
            .set(ghostTwo, { x: 76, opacity: 0.06 }, 0)
            .to(camera, { x: 132, duration: beat * 3, ease: "power2.inOut", onUpdate: applyCamera }, 0)
            .to(farCopy, { x: 0, y: 0, scaleX: 1, duration: beat, ease: "power3.out" }, 0)
            .to(heroes[0], { opacity: 1, filter: "blur(0px)", duration: beat, ease: "power3.out" }, 0)
            .to(nearCopy, { x: 0, y: 0, scaleX: 1, duration: beat, ease: "power3.out" }, beat)
            .to(heroes[1], { opacity: 1, filter: "blur(0px)", duration: beat, ease: "power3.out" }, beat)
            .to([chrome, progress], { opacity: 1, duration: 0.225, ease: "power2.out" }, 0)
            .to(marker, { opacity: 1, scaleY: 1, duration: 0.15, ease: "power3.out" }, 0.075)
            .to(subline, { opacity: 1, x: 0, duration: 0.225, ease: "power3.out" }, beat)
            .fromTo(microCluster, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.225, ease: "power3.out" }, beat * 2)
            .to([farRule, nearRule, depthTags], { opacity: 1, duration: 0.225, ease: "power2.out" }, beat)
            .to(copyFlow, { x: 0, opacity: 0.18, duration: beat * 2, ease: "power2.out" }, 0)
            .to(ghostOne, { x: 0, opacity: 0.38, duration: beat * 2, ease: "power2.out" }, beat)
            .to(ghostTwo, { x: 0, opacity: 0.22, duration: beat * 2, ease: "power2.out" }, beat)
            .to(farCopy, { x: -34, duration: beat * 2, ease: "sine.inOut" }, beat * 3)
            .to(nearCopy, { x: 34, duration: beat * 2, ease: "sine.inOut" }, beat * 3)
            .to(copyFlow, { x: 18, duration: beat * 2, ease: "sine.inOut" }, beat * 3)
            .to(ghostOne, { x: 18, duration: beat * 2, ease: "sine.inOut" }, beat * 3)
            .to(ghostTwo, { x: -16, duration: beat * 2, ease: "sine.inOut" }, beat * 3);

          window.__timelines[compositionId] = tl;
          tl.seek(0);
        })();
      </script>
