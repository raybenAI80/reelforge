<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>ReelForge v7 — 한 줄이면 된다</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          color: var(--rf-text, #ffffff);
          font-family: var(--rf-font-sans, "Pretendard", system-ui, sans-serif);
        }

        .stage {
          position: absolute;
          inset: 0;
          background: var(--rf-surface, var(--rf-bg, #010102));
          filter: brightness(1);
          transform: translateZ(0);
          will-change: filter;
          animation: v7s-s01-stage-breathe 1.0212s ease-in-out calc(var(--rf-scene-start, 0s) + 1.2s) 2 alternate both;
        }

        .chrome-section,
        .progress-label {
          position: absolute;
          color: var(--rf-ink-subtle, var(--rf-muted-text, #8a8f98));
          font-family: var(--rf-font-mono, "Pretendard Mono Fallback", ui-monospace, monospace);
          font-size: 13px;
          font-weight: 400;
          letter-spacing: 0.14em;
          line-height: 1;
          white-space: nowrap;
        }

        .chrome-section {
          top: 8%;
          left: 7.4%;
        }

        .hero {
          position: absolute;
          top: calc(60% - 0.76em);
          left: 7.4%;
          margin: 0;
          color: var(--rf-text, #ffffff);
          font-family: var(--rf-font-sans, "Pretendard", system-ui, sans-serif);
          font-size: clamp(120px, 10vw, 190px);
          font-weight: 800;
          letter-spacing: -0.045em;
          line-height: 0.96;
          text-align: left;
          white-space: nowrap;
          word-break: keep-all;
          transform-origin: left 80%;
          will-change: transform;
        }

        .glyph {
          display: inline-block;
          will-change: transform, filter, opacity;
        }

        .term-accent {
          color: var(--rf-accent, #828fff);
        }

        .progress {
          position: absolute;
          right: 0;
          bottom: 8%;
          left: 0;
          height: 1px;
          background: var(--rf-hairline, #26272e);
          will-change: opacity, transform;
        }

        .progress-marker {
          position: absolute;
          top: -6px;
          left: 12.5%;
          width: 1px;
          height: 13px;
          background: var(--rf-text, #ffffff);
          transform: translateX(-0.5px);
        }

        .progress-label {
          top: 10px;
          left: 12.5%;
          transform: translateX(-50%);
        }

        @keyframes v7s-s01-stage-breathe {
          from {
            filter: brightness(1);
          }
          to {
            filter: brightness(1.24);
          }
        }
      </style>
      <main id="root" data-rf-fragment-version="1.0" data-composition-id="v7s-s01">
        <div class="stage" aria-hidden="true"></div>
        <div class="chrome-section">01 — HOOK</div>
        <h1 class="hero" aria-label="한 줄이면 된다"><span class="term-accent"><span class="glyph">한</span> <span class="glyph">줄</span></span><span class="glyph">이</span><span class="glyph">면</span><span class="glyph">된</span><span class="glyph">다</span></h1>
        <div class="progress" aria-hidden="true">
          <span class="progress-marker"></span>
          <span class="progress-label">01 / 08</span>
        </div>
      </main>
      <script>
        (() => {
          const compositionId = "v7s-s01";
          const root = document.querySelector(`[data-composition-id="${compositionId}"]`);
          if (!root) return;

          const stage = root.querySelector(".stage");
          const chrome = root.querySelector(".chrome-section");
          const hero = root.querySelector(".hero");
          const progress = root.querySelector(".progress");
          const glyphs = Array.from(root.querySelectorAll(".glyph"));

          const scatterFor = (index) => {
            const angle = ((index * 137.5) + 18) % 360;
            const radians = angle * Math.PI / 180;
            const radiusX = 440 + (index % 3) * 150;
            const radiusY = 260 + ((index + 1) % 3) * 115;
            return {
              x: Math.cos(radians) * radiusX,
              y: Math.sin(radians) * radiusY,
              rotation: (index % 2 ? 1 : -1) * (24 + index * 5),
              scale: 0.42 + (index % 3) * 0.22
            };
          };

          window.__timelines = window.__timelines || {};
          const tl = gsap.timeline({ paused: true });

          tl.addLabel("scatter", 0)
            .fromTo(stage, { opacity: 0.72 }, { opacity: 1, duration: 0.5106, ease: "power3.out" }, "scatter")
            .fromTo(chrome, { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.32, ease: "power3.out" }, "scatter")
            .fromTo(progress, { opacity: 0, y: 7 }, { opacity: 1, y: 0, duration: 0.32, ease: "power3.out" }, "scatter");

          glyphs.forEach((glyph, index) => {
            const scatter = scatterFor(index);
            tl.fromTo(
              glyph,
              {
                x: scatter.x,
                y: scatter.y,
                rotation: scatter.rotation,
                scale: scatter.scale,
                opacity: 0.42,
                filter: "blur(7px)"
              },
              {
                x: 0,
                y: 0,
                rotation: 0,
                scale: 1,
                opacity: 1,
                filter: "blur(0px)",
                duration: 0.46,
                ease: "power4.out"
              },
              0.002 + index * 0.008
            );
          });

          tl.addLabel("lockup", 0.5106)
            .to(hero, { scale: 1.018, duration: 0.065, ease: "power2.out" }, "lockup")
            .to(hero, { scale: 1, duration: 0.14, ease: "power3.out" }, 0.5756);

          window.__timelines[compositionId] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>
