<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>ReelForge v7 — 한 줄.</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          color: var(--rf-text, #ffffff);
          font-family: var(--rf-font-sans, "Pretendard", system-ui, sans-serif);
          isolation: isolate;
        }

        #root .s01-surface,
        #root .s01-stage {
          position: absolute;
          inset: 0;
        }

        #root .s01-surface {
          background: var(--rf-bg, #090a0e);
        }

        #root .s01-stage {
          filter: brightness(1);
          transform: translateZ(0);
          will-change: filter;
          animation: s01-stage-breathe 1.02s ease-in-out calc(var(--rf-scene-start, 0s) + 1.2s) infinite alternate;
        }

        #root .s01-ghost {
          position: absolute;
          z-index: 0;
          margin: 0;
          color: transparent;
          font-family: var(--rf-font-sans, "Pretendard", system-ui, sans-serif);
          font-size: 31vw;
          font-weight: 800;
          letter-spacing: -0.06em;
          line-height: 0.96;
          white-space: nowrap;
          -webkit-text-stroke: 1px var(--rf-hairline-strong, rgba(255, 255, 255, 0.36));
          opacity: 0.12;
          pointer-events: none;
          will-change: transform;
        }

        #root .s01-ghost--one {
          top: 8%;
          left: -13%;
          animation: s01-ghost-forward 1.5s linear infinite alternate;
        }

        #root .s01-ghost--two {
          right: -22%;
          bottom: -11%;
          font-size: 34vw;
          opacity: 0.08;
          animation: s01-ghost-reverse 1.5s linear infinite alternate;
        }

        #root .s01-baseline,
        #root .s01-progress {
          position: absolute;
          z-index: 1;
          right: 0;
          left: 0;
          height: 1px;
          background: var(--rf-hairline, rgba(255, 255, 255, 0.14));
          transform-origin: left center;
          will-change: transform, opacity;
        }

        #root .s01-baseline {
          top: 60%;
          opacity: 0.48;
        }

        #root .s01-baseline::before,
        #root .s01-baseline::after {
          position: absolute;
          top: -6px;
          width: 1px;
          height: 13px;
          background: var(--rf-hairline-strong, rgba(255, 255, 255, 0.36));
          content: "";
        }

        #root .s01-baseline::before {
          left: 7.4%;
        }

        #root .s01-baseline::after {
          left: 46.6%;
        }

        #root .s01-vector {
          position: absolute;
          z-index: 1;
          width: 1px;
          height: 100%;
          background: var(--rf-hairline, rgba(255, 255, 255, 0.14));
          opacity: 0.28;
          transform-origin: center top;
          will-change: transform, opacity;
        }

        #root .s01-vector--left {
          left: 7.4%;
        }

        #root .s01-vector--right {
          left: 46.6%;
        }

        #root .s01-chrome,
        #root .s01-micro {
          margin: 0;
          color: var(--rf-ink-subtle, #8a8f98);
          font-family: var(--rf-font-mono, "Pretendard Mono Fallback", ui-monospace, monospace);
          font-size: 13px;
          font-weight: 400;
          letter-spacing: 0.14em;
          line-height: 1;
          white-space: nowrap;
        }

        #root .s01-chrome {
          position: absolute;
          z-index: 3;
          top: 8%;
          left: 7.4%;
        }

        #root .s01-hero {
          position: absolute;
          z-index: 3;
          top: calc(60% - 0.76em);
          left: 7.4%;
          display: flex;
          align-items: baseline;
          margin: 0;
          color: var(--rf-text, #ffffff);
          font-family: var(--rf-font-sans, "Pretendard", system-ui, sans-serif);
          font-size: clamp(120px, 10vw, 190px);
          font-weight: 800;
          letter-spacing: -0.045em;
          line-height: 0.96;
          white-space: nowrap;
          word-break: keep-all;
          transform-origin: left 80%;
          will-change: transform;
        }

        #root .s01-glyph {
          display: inline-block;
          will-change: transform, filter, opacity;
        }

        #root .s01-glyph--space {
          width: 0.18em;
        }

        #root .s01-glyph--period {
          margin-left: 0.018em;
          color: var(--rf-accent, #a98cff);
          transform-origin: 50% 76%;
        }

        #root .s01-subline {
          position: absolute;
          z-index: 3;
          top: calc(60% + 1.82em);
          left: 7.4%;
          margin: 0;
          color: var(--rf-text, #ffffff);
          font-family: var(--rf-font-mono, "Pretendard Mono Fallback", ui-monospace, monospace);
          font-size: 21px;
          font-weight: 600;
          letter-spacing: 0.14em;
          line-height: 1;
          white-space: nowrap;
          will-change: transform, opacity;
        }

        #root .s01-micro-cluster {
          position: absolute;
          z-index: 3;
          top: calc(60% + 8.4em);
          left: 7.4%;
          display: grid;
          gap: 7px;
          will-change: transform, opacity;
        }

        #root .s01-micro--lock {
          color: var(--rf-text, #ffffff);
        }

        #root .s01-progress {
          z-index: 3;
          top: 92%;
        }

        #root .s01-progress-marker {
          position: absolute;
          top: -6px;
          left: 12.5%;
          width: 1px;
          height: 13px;
          background: var(--rf-text, #ffffff);
          transform: translateX(-0.5px);
          transform-origin: 50% 50%;
          will-change: transform, opacity;
        }

        @keyframes s01-stage-breathe {
          from {
            filter: brightness(1);
          }

          to {
            filter: brightness(1.24);
          }
        }

        @keyframes s01-ghost-forward {
          from {
            transform: translate3d(-24px, 12px, 0);
          }

          to {
            transform: translate3d(24px, -12px, 0);
          }
        }

        @keyframes s01-ghost-reverse {
          from {
            transform: translate3d(24px, -12px, 0);
          }

          to {
            transform: translate3d(-24px, 12px, 0);
          }
        }
      </style>

      <main id="root" data-rf-fragment-version="1.0" data-composition-id="v7s-s01">
        <div class="s01-surface" aria-hidden="true"></div>
        <div class="s01-stage">
          <p class="s01-ghost s01-ghost--one" aria-hidden="true">한 줄.</p>
          <p class="s01-ghost s01-ghost--two" aria-hidden="true">한 줄.</p>
          <div class="s01-baseline" aria-hidden="true"></div>
          <div class="s01-vector s01-vector--left" aria-hidden="true"></div>
          <div class="s01-vector s01-vector--right" aria-hidden="true"></div>

          <p class="s01-chrome">01 — LINE</p>
          <h1 class="s01-hero" aria-label="한 줄.">
            <span class="s01-glyph s01-glyph--han">한</span><span class="s01-glyph s01-glyph--space" aria-hidden="true"></span><span class="s01-glyph s01-glyph--jul">줄</span><span class="s01-glyph s01-glyph--period">.</span>
          </h1>
          <p class="s01-subline">01 / 160 BPM</p>
          <div class="s01-micro-cluster" aria-label="measurement tags">
            <p class="s01-micro">X 07.4 / Y 60.0</p>
            <p class="s01-micro">IN 00.000</p>
            <p class="s01-micro s01-micro--lock">LOCK 00.750</p>
          </div>
          <div class="s01-progress" aria-hidden="true"><span class="s01-progress-marker"></span></div>
        </div>
      </main>

      <script>
        (() => {
          const compositionId = "v7s-s01";
          const root = document.querySelector(`[data-composition-id="${compositionId}"]`);
          if (!root) return;

          const chrome = root.querySelector(".s01-chrome");
          const hero = root.querySelector(".s01-hero");
          const han = root.querySelector(".s01-glyph--han");
          const jul = root.querySelector(".s01-glyph--jul");
          const period = root.querySelector(".s01-glyph--period");
          const subline = root.querySelector(".s01-subline");
          const microCluster = root.querySelector(".s01-micro-cluster");
          const baseline = root.querySelector(".s01-baseline");
          const vectors = Array.from(root.querySelectorAll(".s01-vector"));
          const progress = root.querySelector(".s01-progress");
          const progressMarker = root.querySelector(".s01-progress-marker");

          window.__timelines = window.__timelines || {};
          const tl = gsap.timeline({ paused: true });

          tl.set([chrome, subline, microCluster, progress], { opacity: 0 })
            .set(baseline, { opacity: 0, scaleX: 0 })
            .set(vectors, { opacity: 0, scaleY: 0 })
            .set(progressMarker, { opacity: 0, scaleY: 0 })
            .set(hero, { scale: 1, transformOrigin: "left 80%" })
            .set(han, { x: -1180, y: -560, rotation: -36, scale: 0.58, opacity: 0.8, filter: "blur(10px)" })
            .set(jul, { x: 960, y: 620, rotation: 29, scale: 0.5, opacity: 0.8, filter: "blur(10px)" })
            .set(period, { x: 710, y: -700, rotation: 72, scale: 3.2, opacity: 0.8, filter: "blur(10px)" })
            .to(baseline, { opacity: 0.48, scaleX: 1, duration: 0.375, ease: "power3.out" }, 0)
            .to(vectors, { opacity: 0.28, scaleY: 1, duration: 0.375, ease: "power3.out" }, 0)
            .fromTo(chrome, { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.375, ease: "power3.out" }, 0)
            .fromTo(progress, { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.375, ease: "power3.out" }, 0)
            .to(progressMarker, { opacity: 1, scaleY: 1, duration: 0.1875, ease: "power3.out" }, 0.1875)
            .fromTo(subline, { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.375, ease: "power3.out" }, 0.375)
            .fromTo(microCluster, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.375, ease: "power3.out" }, 0.375)
            .to(han, { x: 0, y: 0, rotation: 0, scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.75, ease: "power4.out" }, 0)
            .to(jul, { x: 0, y: 0, rotation: 0, scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.75, ease: "power4.out" }, 0)
            .to(period, { x: 0, y: 0, rotation: 0, scale: 1.34, opacity: 1, filter: "blur(0px)", duration: 0.75, ease: "power4.out" }, 0)
            .to(period, { scale: 1, duration: 0.15, ease: "back.out(3)" }, 0.75)
            .to(hero, { scale: 1.018, duration: 0.075, ease: "power2.out" }, 0.75)
            .to(hero, { scale: 1, duration: 0.075, ease: "power2.inOut" }, 0.825);

          window.__timelines[compositionId] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>
