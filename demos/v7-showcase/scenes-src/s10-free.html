  <body>
    <template>
      <style>
        #v7s-s10 {
          position: absolute;
          inset: 0;

        }

        #v7s-s10 .s10-surface,
        #v7s-s10 .s10-stage,
        #v7s-s10 .s10-world,
        #v7s-s10 .s10-portal-system,
        #v7s-s10 .s10-hit-flash {

          inset: 0;

        #v7s-s10 .s10-surface {

          background: var(--rf-bg, #010102);

          will-change: filter, opacity;

        #v7s-s10 .s10-stage {
          z-index: 1;
          overflow: hidden;
          will-change: transform;

        #v7s-s10 .s10-world {
          z-index: 1;
          transform-origin: 63% 50%;
          will-change: transform, filter, opacity;

        #v7s-s10 .s10-portal-system {

        #v7s-s10 .s10-portal-stripe {

        #v7s-s10 .s10-portal-stripe--two {

          opacity: 0.44;
          transform: rotate(12deg);
        }

        #v7s-s10 .s10-aperture {

        #v7s-s10 .s10-portal-rule {

          font-weight: 400;

          line-height: 1;
          white-space: nowrap;
        }

        #v7s-s10 .s10-ghost {
          position: absolute;
          z-index: 2;
          margin: 0;

          font-family: var(--rf-font-sans, "Pretendard", system-ui, sans-serif);
          font-size: clamp(720px, 57vw, 1090px);
          font-weight: 800;
          letter-spacing: -0.06em;
          line-height: 0.76;
          white-space: nowrap;
          -webkit-text-stroke: 1px var(--rf-hairline-strong, #3a3c46);

        #v7s-s10 .s10-ghost--one {
          top: -20%;

          transform: rotate(-8deg);
        }

        #v7s-s10 .s10-ghost--two {
          top: 37%;

          transform: rotate(-8deg);

        }

        #v7s-s10 .s10-chrome,
        #v7s-s10 .s10-micro-cluster {
          margin: 0;
          color: var(--rf-ink-subtle, #8a8f98);
          font-family: var(--rf-font-mono, "Pretendard Mono Fallback", ui-monospace, monospace);
          font-size: 13px;
          font-weight: 400;
          letter-spacing: 0.14em;
          line-height: 1;
          white-space: nowrap;
          will-change: transform, opacity;
        }

        #v7s-s10 .s10-chrome {
          position: absolute;
          z-index: 5;
          top: 8%;
          left: 7.4%;
        }

        #v7s-s10 .s10-hero-anchor {
          position: absolute;
          z-index: 5;
          top: 60%;
          left: 7.4%;
          transform: translateY(-0.96em);
          transform-origin: left 100%;
          will-change: transform, filter, opacity;
        }

        #v7s-s10 .s10-hero {
          position: relative;
          width: 5.7em;
          height: 0.96em;
          margin: 0;
          color: var(--rf-text, #ffffff);
          font-family: var(--rf-font-sans, "Pretendard", system-ui, sans-serif);
          font-size: clamp(120px, 10vw, 190px);
          font-weight: 800;
          letter-spacing: -0.045em;
          line-height: 0.96;
          white-space: nowrap;
          word-break: keep-all;
        }

        #v7s-s10 .s10-phrase,
        #v7s-s10 .s10-scramble,
        #v7s-s10 .s10-click,
        #v7s-s10 .s10-period {
          position: absolute;
          top: 0;
          left: 0;
          display: block;
          transform-origin: left 76%;
          will-change: transform, filter, opacity;
        }

        #v7s-s10 .s10-scramble--two {
          left: 0.05em;
        }

        #v7s-s10 .s10-click {
          color: var(--rf-accent, #5e6ad2);
          transform-origin: left 100%;
        }

        #v7s-s10 .s10-period {
          left: 4.25em;
          color: var(--rf-text, #ffffff);
          transform-origin: 50% 100%;
        }

        #v7s-s10 .s10-subline {
          position: absolute;
          z-index: 5;
          top: calc(92% - 32px);
          right: 16.6667%;
          margin: 0;
          color: var(--rf-ink-subtle, #8a8f98);
          font-family: var(--rf-font-mono, "Pretendard Mono Fallback", ui-monospace, monospace);
          font-size: 13px;
          font-weight: 400;
          letter-spacing: 0.14em;
          line-height: 1;
          white-space: nowrap;
          will-change: transform, opacity;
        }

        #v7s-s10 .s10-micro-cluster {
          position: absolute;
          z-index: 5;
          top: 69.3%;
          left: 7.4%;
          display: flex;
          gap: 1.35em;
        }

        #v7s-s10 .s10-micro-cluster span + span {
          position: relative;
        }

        #v7s-s10 .s10-micro-cluster span + span::before {
          position: absolute;
          top: 0;
          bottom: 0;
          left: -0.68em;
          width: 1px;
          background: var(--rf-hairline, #26272e);
          content: "";
        }

        #v7s-s10 .s10-progress {
          position: absolute;
          z-index: 6;
          right: 0;
          bottom: 8%;
          left: 0;
          height: 1px;
          background: var(--rf-hairline, #26272e);
          transform-origin: left center;
          will-change: transform, opacity;
        }

        #v7s-s10 .s10-progress-marker {
          position: absolute;
          top: -6px;
          left: calc(83.3333% - 0.5px);
          width: 1px;
          height: 13px;
          background: var(--rf-text, #ffffff);
          transform-origin: center;
          will-change: transform, opacity;
        }

        #v7s-s10 .s10-hit-flash {
          z-index: 7;
          background: var(--rf-text, #ffffff);
          mix-blend-mode: screen;
          opacity: 0;
          pointer-events: none;
          will-change: opacity;
        }

        @keyframes v7s-s10-breathe {
          from {
            filter: brightness(1);
            opacity: 0.86;
          }

          to {
            filter: brightness(1.24);
            opacity: 1;
          }
        }
      </style>

      <main id="v7s-s10" data-rf-fragment-version="1.0" data-composition-id="v7s-s10">
        <div class="s10-surface" aria-hidden="true"></div>
        <div class="s10-stage">
          <div class="s10-world" aria-hidden="true">
            <div class="s10-portal-system">
              <div class="s10-portal-stripe s10-portal-stripe--one"></div>
              <div class="s10-portal-stripe s10-portal-stripe--two"></div>
              <div class="s10-aperture"><div class="s10-aperture-core"></div><div class="s10-aperture-field"></div></div>
              <div class="s10-portal-rule"><p class="s10-portal-rule-tag">PORTAL / 10</p></div>
            </div>
            <p class="s10-ghost s10-ghost--one">딸깍</p>
            <p class="s10-ghost s10-ghost--two">딸깍</p>
          </div>

          <p class="s10-chrome">10 — CLICK</p>
          <div class="s10-hero-anchor">
            <h1 class="s10-hero">
              <span class="s10-phrase">짜여 있다,</span>
              <span class="s10-scramble s10-scramble--one">ㄸㅑㄹㄲㅏㄱ</span>
              <span class="s10-scramble s10-scramble--two">ㄸㅑㄹㄲㅏ⌁</span>
              <span class="s10-click">딸깍</span>
              <span class="s10-period">.</span>
            </h1>
          </div>
          <p class="s10-subline">ONE CLICK</p>
          <div class="s10-micro-cluster" aria-label="click measurement tags">
            <span>PORTAL / IN</span><span>PEAK / 95</span><span>010 / 012</span>
          </div>
          <div class="s10-progress" aria-hidden="true"><span class="s10-progress-marker"></span></div>
        </div>
        <div class="s10-hit-flash" aria-hidden="true"></div>
      </main>

      <script>
        (() => {
          const compositionId = "v7s-s10";
          const root = document.querySelector(`[data-composition-id="${compositionId}"]`);
          if (!root) return;

          const beat = 0.375;
          const stage = root.querySelector(".s10-stage");
          const world = root.querySelector(".s10-world");
          const aperture = root.querySelector(".s10-aperture");
          const stripeOne = root.querySelector(".s10-portal-stripe--one");
          const stripeTwo = root.querySelector(".s10-portal-stripe--two");
          const portalRule = root.querySelector(".s10-portal-rule");
          const ghostOne = root.querySelector(".s10-ghost--one");
          const ghostTwo = root.querySelector(".s10-ghost--two");
          const chrome = root.querySelector(".s10-chrome");
          const heroAnchor = root.querySelector(".s10-hero-anchor");
          const phrase = root.querySelector(".s10-phrase");
          const scrambleOne = root.querySelector(".s10-scramble--one");
          const scrambleTwo = root.querySelector(".s10-scramble--two");
          const click = root.querySelector(".s10-click");
          const period = root.querySelector(".s10-period");
          const subline = root.querySelector(".s10-subline");
          const microCluster = root.querySelector(".s10-micro-cluster");
          const progress = root.querySelector(".s10-progress");
          const marker = root.querySelector(".s10-progress-marker");
          const flash = root.querySelector(".s10-hit-flash");

          window.__timelines = window.__timelines || {};
          const tl = gsap.timeline({ paused: true });

          tl.set(world, { scale: 6.4, filter: "blur(18px)", opacity: 0.94, transformOrigin: "63% 50%" })
            .set(heroAnchor, { scale: 2.7, x: 46, filter: "blur(10px)", opacity: 1, transformOrigin: "left 100%" })
            .set(aperture, { scale: 1.12, opacity: 0.96, transformOrigin: "50% 50%" })
            .set([chrome, subline, microCluster, progress], { opacity: 0 })
            .set(progress, { scaleX: 0.16 })
            .set(marker, { opacity: 0, scaleY: 0.2 })
            .set(phrase, { opacity: 1, x: 0, filter: "blur(0px)" })
            .set([scrambleOne, scrambleTwo, click, period], { opacity: 0 })
            .set(scrambleOne, { x: -28, skewX: -7 })
            .set(scrambleTwo, { x: 34, skewX: 6 })
            .set(click, { x: -54, y: 14, scaleX: 1.18, skewX: -7, filter: "blur(5px)" })
            .set(period, { scale: 0, y: 18 })
            .set([ghostOne, ghostTwo], { x: 92, opacity: 0.08 })
            .set(portalRule, { opacity: 0.22, x: -78 })
            .set([stripeOne, stripeTwo], { x: 112, opacity: 0.16 })
            .to(world, { scale: 1, filter: "blur(0px)", opacity: 1, duration: beat, ease: "power4.out" }, 0)
            .to(heroAnchor, { scale: 1, x: 0, filter: "blur(0px)", duration: beat, ease: "power4.out" }, 0)
            .to(aperture, { scale: 1, opacity: 0.9, duration: beat, ease: "power3.out" }, 0)
            .to([chrome, subline, microCluster], { opacity: 1, duration: 0.15, ease: "power3.out" }, 0.225)
            .to(progress, { opacity: 1, scaleX: 1, duration: 0.15, ease: "power3.out" }, 0.225)
            .to(marker, { opacity: 1, scaleY: 1, duration: 0.1, ease: "power3.out" }, 0.3)
            .to([ghostOne, ghostTwo], { x: 0, duration: beat, ease: "power3.out" }, 0.3)
            .to(portalRule, { opacity: 0.72, x: 0, duration: 0.24, ease: "power3.out" }, 0.3)
            .to([stripeOne, stripeTwo], { x: 0, opacity: 0.48, duration: 0.3, ease: "power3.out" }, 0.3)
            .to(scrambleOne, { opacity: 1, x: 0, skewX: 0, duration: 0.075, ease: "steps(2)" }, beat * 2)
            .to(phrase, { opacity: 0.28, x: 20, duration: 0.075, ease: "steps(2)" }, beat * 2)
            .to(scrambleOne, { opacity: 0, x: 34, skewX: 5, duration: 0.075, ease: "steps(2)" }, beat * 2 + 0.075)
            .to(scrambleTwo, { opacity: 1, x: 0, skewX: 0, duration: 0.075, ease: "steps(2)" }, beat * 2 + 0.075)
            .to(scrambleTwo, { opacity: 0, x: -28, skewX: -6, duration: 0.075, ease: "steps(2)" }, beat * 2 + 0.15)
            .to(phrase, { opacity: 0.46, x: 0, y: -440, scale: 0.11, duration: 0.15, ease: "power3.out" }, beat * 3 - 0.15)
            .to(click, { opacity: 1, duration: 0.025, ease: "none" }, beat * 3 - 0.025)
            .to(click, { x: 18, y: 6, scale: 2.42, skewX: 4, filter: "blur(0px)", duration: 0.06, ease: "power4.out" }, beat * 3)
            .to(click, { x: 0, y: 0, scale: 2.14, skewX: 0, duration: 0.12, ease: "back.out(2.2)" }, beat * 3 + 0.06)
            .to(period, { opacity: 1, scale: 1.52, y: -4, duration: 0.06, ease: "power4.out" }, beat * 3)
            .to(period, { scale: 1, y: 0, duration: 0.12, ease: "back.out(2.6)" }, beat * 3 + 0.06)
            .to(flash, { opacity: 0.28, duration: 0.035, ease: "none" }, beat * 3)
            .to(flash, { opacity: 0, duration: 0.075, ease: "power2.out" }, beat * 3 + 0.035)
            .to(stage, { x: -20, y: 7, duration: 0.025, ease: "none" }, beat * 3)
            .to(stage, { x: 16, y: -5, duration: 0.025, ease: "none" }, beat * 3 + 0.025)
            .to(stage, { x: -9, y: 3, duration: 0.025, ease: "none" }, beat * 3 + 0.05)
            .to(stage, { x: 0, y: 0, duration: 0.05, ease: "power2.out" }, beat * 3 + 0.075)
            .to(aperture, { scale: 1.06, opacity: 1, duration: 0.075, ease: "power4.out" }, beat * 3)
            .to(aperture, { scale: 1, opacity: 0.9, duration: 0.18, ease: "power2.out" }, beat * 3 + 0.075)
            .to([ghostOne, ghostTwo], { x: -34, duration: 0.18, ease: "power2.out" }, beat * 4)
            .to([stripeOne, stripeTwo], { x: -38, duration: 0.18, ease: "power2.out" }, beat * 4)
            .to(portalRule, { x: 26, duration: 0.18, ease: "power2.out" }, beat * 4);

          window.__timelines[compositionId] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>
