      <style>
        .v7s-s06 {

        .v7s-s06 .s06-plane--mid {
          z-index: 2;

          will-change: transform, opacity;
        }

        .v7s-s06 .s06-focus-marker {

          z-index: 5;

          transform: translateY(-0.8em);
          transform-origin: 50% 100%;
          will-change: height, transform, opacity;
        }

        .v7s-s06 .s06-marker-tag {
          position: absolute;

          transform-origin: left center;
          will-change: transform, opacity;
        }

        .v7s-s06 .s06-chrome {
          position: absolute;
          z-index: 7;

          left: 7.4%;
          will-change: transform, opacity;
        }

        .v7s-s06 .s06-progress {
          position: absolute;
          z-index: 7;
          top: 92%;
          right: 0;
          left: 0;
          height: 1px;
          background: var(--rf-hairline, #26272e);
          transform-origin: left center;
          will-change: transform, opacity;
        }

        .v7s-s06 .s06-progress-marker {
          position: absolute;
          top: -6px;
          left: calc(75% - 0.5px);
          width: 1px;
          height: 13px;
          background: var(--rf-text, #ffffff);
          transform-origin: 50% 50%;
          will-change: transform, opacity;

          from {
            filter: brightness(1);
            opacity: 0.86;
          }

            filter: brightness(1.24);
            opacity: 1;

        <div class="s06-progress" aria-hidden="true"><span class="s06-progress-marker"></span></div>

      <script>
        (() => {
          const compositionId = "v7s-s06";
          const root = document.querySelector(`[data-composition-id="${compositionId}"]`);
          if (!root) return;

          const blur = root.querySelector("#v7s-s06-push-blur feGaussianBlur");
          const stage = root.querySelector(".s06-stage");
          const rig = root.querySelector(".s06-rig");
          const farPlane = root.querySelector(".s06-plane--far");
          const midPlane = root.querySelector(".s06-plane--mid");
          const nearPlane = root.querySelector(".s06-plane--near");
          const heroPlane = root.querySelector(".s06-hero-plane");
          const hero = root.querySelector(".s06-hero");
          const subline = root.querySelector(".s06-subline");
          const ghosts = root.querySelectorAll(".s06-ghost");
          const depthRules = root.querySelectorAll(".s06-depth-rule");
          const depthTags = root.querySelectorAll(".s06-depth-tag");
          const focusMarker = root.querySelector(".s06-focus-marker");
          const markerTag = root.querySelector(".s06-marker-tag");
          const chrome = root.querySelector(".s06-chrome");
          const progress = root.querySelector(".s06-progress");
          const progressMarker = root.querySelector(".s06-progress-marker");

          window.__timelines = window.__timelines || {};
          const tl = gsap.timeline({ paused: true });

          tl.set(rig, { z: -120, transformStyle: "preserve-3d", transformOrigin: "35% 57%" }, 0)
            .set(farPlane, { z: -520, transformStyle: "preserve-3d" }, 0)
            .set(midPlane, { z: -210, transformStyle: "preserve-3d" }, 0)
            .set(nearPlane, { z: 130, transformStyle: "preserve-3d" }, 0)
            .set([ghosts, depthRules, depthTags], { opacity: 0 }, 0)

            .set(midPlane, { x: -46, y: 14 }, 0)
            .set(nearPlane, { x: 28, y: -16 }, 0)
            .set(heroPlane, { opacity: 0, x: -74, scale: 0.82, transformOrigin: "left 80%" }, 0)
            .set(hero, { skewX: -7, transformOrigin: "left 80%" }, 0)
            .set(subline, { opacity: 0, x: -32 }, 0)
            .set(focusMarker, { height: 0, opacity: 0 }, 0)
            .set(markerTag, { opacity: 0, x: -12 }, 0)
            .set([chrome, progress], { opacity: 0 }, 0)
            .set(progressMarker, { opacity: 0, scaleY: 0.35 }, 0)
            .to([chrome, progress], { opacity: 1, duration: 0.18, ease: "power2.out" }, 0)
            .to(progressMarker, { opacity: 1, scaleY: 1, duration: 0.15, ease: "power3.out" }, 0.075)
            .to(heroPlane, { opacity: 1, x: 0, scale: 1, duration: 0.33, ease: "power4.out" }, 0)
            .to(hero, { skewX: 0, duration: 0.33, ease: "power4.out" }, 0)
            .to(subline, { opacity: 1, x: 0, duration: 0.225, ease: "power3.out" }, 0.15)
            .to(focusMarker, { opacity: 1, height: 178, duration: 0.375, ease: "power3.out" }, 0)
            .to(markerTag, { opacity: 1, x: 0, duration: 0.15, ease: "power3.out" }, 0.225)
            .to(farPlane, { opacity: 1, x: 0, y: 0, duration: 0.375, ease: "power3.out" }, 0.375)
            .to(midPlane, { opacity: 1, x: 0, y: 0, duration: 0.375, ease: "power3.out" }, 0.45)
            .to(nearPlane, { opacity: 1, x: 0, y: 0, duration: 0.375, ease: "power3.out" }, 0.525)
            .to([ghosts, depthRules, depthTags], { opacity: 1, duration: 0.225, ease: "power2.out" }, 0.375)
            .to(rig, { z: 405, duration: 0.75, ease: "power3.in" }, 0.375)
            .to(heroPlane, { scale: 1.13, duration: 0.75, ease: "power3.in" }, 0.375)
            .to(farPlane, { x: -66, duration: 0.75, ease: "power2.in" }, 0.375)
            .to(midPlane, { x: -34, duration: 0.75, ease: "power2.in" }, 0.375)
            .to(nearPlane, { x: 28, duration: 0.75, ease: "power2.in" }, 0.375)
            .to(focusMarker, { height: 236, duration: 0.375, ease: "power2.out" }, 0.75)
            .to(heroPlane, { scale: 1.18, duration: 0.375, ease: "power2.out" }, 0.75)
            .to(focusMarker, { opacity: 0.72, duration: 0.375, ease: "sine.inOut" }, 1.125)
            .to(stage, { x: -112, scale: 1.06, duration: 0.3, ease: "power4.in" }, 2)
            .to(blur, { attr: { stdDeviation: "22 1" }, duration: 0.3, ease: "power4.in" }, 2)
            .to(heroPlane, { scale: 1.26, duration: 0.3, ease: "power4.in" }, 2);

          window.__timelines[compositionId] = tl;
