      <script>
        (() => {
          const compositionId = "v7s-s03";
          const root = document.querySelector(`[data-composition-id="${compositionId}"]`);
          if (!root) return;

          const chrome = root.querySelector(".s03-chrome-label");
          const label = root.querySelector(".s03-verified-label");
          const counter = root.querySelector(".s03-counter");
          const meter = root.querySelector(".s03-meter");
          const caption = root.querySelector(".s03-meter-caption");
          const energyColumn = root.querySelector(".s03-energy-column");
          const energyTicks = Array.from(root.querySelectorAll(".s03-energy-tick"));
          const marker = root.querySelector(".s03-meter-marker");
          const progress = root.querySelector(".s03-progress");
          const target = Number(counter.getAttribute("data-target")) || 31;
          const countState = { value: 0 };
          const markerStops = [0, 495.484, 990.968, 1486.452, 1920];

          const updateCount = () => {
            const value = Math.max(0, Math.min(target, Math.round(countState.value)));
            counter.textContent = String(value);
          };

          updateCount();
          window.__timelines = window.__timelines || {};
          const tl = gsap.timeline({ paused: true });

          tl.set([chrome, label, meter, caption, energyColumn, progress], { opacity: 0 })
            .set(counter, { opacity: 1, y: -43.2, scale: 1, transformOrigin: "left 80%" })
            .set(marker, { x: markerStops[0] })
            .set(energyTicks, { opacity: 0.28 })
            .fromTo(chrome, { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.2, ease: "power3.out" }, 0)
            .fromTo(label, { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.24, ease: "power3.out" }, 0.04)
            .to(counter, { y: 0, duration: 0.408, ease: "power3.out" }, 0)
            .fromTo([meter, caption, energyColumn, progress], { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, 0.12)
            .to(countState, { value: 8, duration: 0.001, ease: "none", onUpdate: updateCount }, 0.5106)
            .to(marker, { x: markerStops[1], duration: 0.16, ease: "power2.out" }, 0.5106)
            .to(energyTicks.slice(0, 8), { opacity: 1, duration: 0.001, ease: "none", stagger: 0.022 }, 0.5106)
            .to(counter, { scale: 1.028, duration: 0.045, ease: "power2.out" }, 0.5106)
            .to(counter, { scale: 1, duration: 0.13, ease: "expo.out" }, 0.5556)
            .to(countState, { value: 16, duration: 0.001, ease: "none", onUpdate: updateCount }, 1.0212)
            .to(marker, { x: markerStops[2], duration: 0.16, ease: "power2.out" }, 1.0212)
            .to(energyTicks.slice(8, 16), { opacity: 1, duration: 0.001, ease: "none", stagger: 0.022 }, 1.0212)
            .to(counter, { scale: 1.028, duration: 0.045, ease: "power2.out" }, 1.0212)
            .to(counter, { scale: 1, duration: 0.13, ease: "expo.out" }, 1.0662)
            .to(countState, { value: 24, duration: 0.001, ease: "none", onUpdate: updateCount }, 1.5318)
            .to(marker, { x: markerStops[3], duration: 0.16, ease: "power2.out" }, 1.5318)
            .to(energyTicks.slice(16, 24), { opacity: 1, duration: 0.001, ease: "none", stagger: 0.022 }, 1.5318)

            .to(counter, { scale: 1, duration: 0.13, ease: "expo.out" }, 1.5768)
            .to(countState, { value: 31, duration: 0.001, ease: "none", onUpdate: updateCount }, 2.0424)
