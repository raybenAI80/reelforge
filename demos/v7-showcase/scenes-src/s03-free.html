      <script>
        (() => {
          const compositionId = "v7s-s03";
          const root = document.querySelector(`[data-composition-id="${compositionId}"]`);
          if (!root) return;

          const chrome = root.querySelector(".s03-chrome");
          const hero = root.querySelector(".s03-hero");
          const trace = root.querySelector(".s03-strike-trace");
          const fill = root.querySelector(".s03-strike-fill");
          const strike = root.querySelector(".s03-strike");
          const subline = root.querySelector(".s03-subline");
          const tags = Array.from(root.querySelectorAll(".s03-tag"));
          const xCaption = root.querySelector(".s03-x-caption");
          const ghostX = root.querySelector(".s03-ghost-x");
          const ghostWords = root.querySelector(".s03-ghost-words");
          const stripes = Array.from(root.querySelectorAll(".s03-edge-stripe"));
          const progress = root.querySelector(".s03-progress");
          const marker = root.querySelector(".s03-progress-marker");

          const traceLength = trace.getTotalLength();
          trace.style.strokeDasharray = traceLength;
          trace.style.strokeDashoffset = traceLength;

          window.__timelines = window.__timelines || {};
          const tl = gsap.timeline({ paused: true });

          tl.set([chrome, subline, xCaption, progress], { opacity: 0 })
            .set(tags, { opacity: 0, x: 20 })
            .set(hero, { opacity: 1, x: 150, transformOrigin: "right 60%" })
            .set(strike, { opacity: 1, scaleX: 1, transformOrigin: "left center" })
            .set(fill, { fillOpacity: 0 })
            .set(ghostX, { opacity: 0, scale: 0.92, transformOrigin: "50% 50%" })
            .set(ghostWords, { opacity: 0, x: -36 })
            .set(stripes, { opacity: 0, scaleY: 0.64, transformOrigin: "50% 50%" })
            .set(marker, { scaleY: 0, transformOrigin: "50% 50%" })
            .to(hero, { x: 0, duration: 0.4, ease: "power3.out" }, 0)
            .fromTo(chrome, { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.18, ease: "power3.out" }, 0)
            .to(ghostX, { opacity: 0.48, scale: 1, duration: 0.375, ease: "power2.out" }, 0)
            .to(ghostWords, { opacity: 1, x: 0, duration: 0.375, ease: "power2.out" }, 0.375)
            .to(stripes, { opacity: 0.34, scaleY: 1, duration: 0.24, ease: "power2.out", stagger: 0.045 }, 0.375)
            .to(trace, { strokeDashoffset: 0, duration: 0.375, ease: "power2.out" }, 0.375)
            .to(fill, { fillOpacity: 1, duration: 0.225, ease: "power1.out" }, 0.75)
            .to(strike, { scaleY: 1.45, duration: 0.075, ease: "power2.out" }, 0.75)
            .to(strike, { scaleY: 1, duration: 0.15, ease: "power2.out" }, 0.825)
            .fromTo(subline, { opacity: 0, x: 36 }, { opacity: 1, x: 0, duration: 0.225, ease: "power3.out" }, 0.75)
            .to(tags, { opacity: 1, x: 0, duration: 0.15, ease: "power3.out", stagger: 0.075 }, 0.825)
            .fromTo(xCaption, { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.225, ease: "power3.out" }, 0.75)
            .fromTo(progress, { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power2.out" }, 0.75)
            .to(marker, { scaleY: 1, duration: 0.15, ease: "power2.out" }, 0.75)
            .to(ghostWords, { y: -12, duration: 0.375, ease: "power1.inOut" }, 1.125)
            .to(ghostWords, { y: 0, duration: 0.375, ease: "power1.inOut" }, 1.5);

          window.__timelines[compositionId] = tl;
          tl.seek(0);
