<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>ReelForge v7 — 영상 한 편</title>
  </head>
  <body>
    <template>
      <style>
        #v7s-s02 {
          position: absolute;
          inset: 0;
          overflow: hidden;
          color: var(--rf-text, #f7f7f4);
          font-family: var(--rf-font-sans, "Pretendard", system-ui, sans-serif);
        }

        #v7s-s02 .s02-stage,
        #v7s-s02 .s02-scan,
        #v7s-s02 .s02-ghost-field,
        #v7s-s02 .s02-blinds {
          position: absolute;
          inset: 0;
        }

        #v7s-s02 .s02-stage {
          z-index: 0;
          background: var(--rf-bg, #090a0e);
          animation: s02-stage-breathe 1.02s ease-in-out calc(var(--rf-scene-start, 0s) + 1.2s) infinite alternate;
          will-change: filter;
        }

        #v7s-s02 .s02-ghost-field {
          z-index: 1;
          pointer-events: none;
        }

        #v7s-s02 .s02-ghost {
          position: absolute;
          margin: 0;
          color: var(--rf-bg, #090a0e);
          font-family: var(--rf-font-sans, "Pretendard", system-ui, sans-serif);
          font-size: 34vw;
          font-weight: 800;
          letter-spacing: -0.045em;
          line-height: 0.96;
          white-space: nowrap;
          -webkit-text-stroke: 1px var(--rf-hairline, rgba(255, 255, 255, 0.13));
          opacity: 0.44;
          will-change: transform, opacity;
        }

        #v7s-s02 .s02-ghost--one {
          top: 4%;
          left: -5%;
        }

        #v7s-s02 .s02-ghost--two {
          top: 37%;
          left: -22%;
          opacity: 0.26;
        }

        #v7s-s02 .s02-ghost--three {
          top: 70%;
          left: -10%;
          opacity: 0.18;
        }

        #v7s-s02 .s02-blinds {
          z-index: 2;
          pointer-events: none;
        }

        #v7s-s02 .s02-blind {
          position: absolute;
          top: 0;
          bottom: 0;
          width: 33.334%;
          background: linear-gradient(
            90deg,
            var(--rf-surface-2, #171923),
            var(--rf-bg, #090a0e) 52%,
            var(--rf-surface-3, #22242c)
          );
          transform-origin: 50% 50%;
          will-change: transform, opacity;
        }

        #v7s-s02 .s02-blind--one {
          left: 0;
        }

        #v7s-s02 .s02-blind--two {
          left: 33.333%;
        }

        #v7s-s02 .s02-blind--three {
          left: 66.666%;
        }

        #v7s-s02 .s02-scan {
          z-index: 3;
          background-image: repeating-linear-gradient(
            0deg,
            var(--rf-hairline, rgba(255, 255, 255, 0.13)) 0 1px,
            transparent 1px 7px
          );
          opacity: 0.025;
          pointer-events: none;
          will-change: opacity, transform;
        }

        #v7s-s02 .s02-copy,
        #v7s-s02 .s02-accent-actor {
          position: absolute;
          top: calc(60% - 0.76em);
          left: 7.4%;
          margin: 0;
          font-family: var(--rf-font-sans, "Pretendard", system-ui, sans-serif);
          font-size: clamp(120px, 10vw, 190px);
          font-weight: 800;
          letter-spacing: -0.045em;
          line-height: 0.96;
          white-space: nowrap;
          word-break: keep-all;
          will-change: clip-path, opacity, transform;
        }

        #v7s-s02 .s02-copy--base {
          z-index: 4;
          color: var(--rf-ink-subtle, #9297a2);
        }

        #v7s-s02 .s02-copy--reveal {
          z-index: 5;
          color: var(--rf-text, #f7f7f4);
          clip-path: inset(0 100% 0 0);
        }

        #v7s-s02 .s02-accent-actor {
          z-index: 6;
          color: var(--rf-text, #f7f7f4);
          pointer-events: none;
        }

        #v7s-s02 .s02-accent-filler {
          opacity: 0;
        }

        #v7s-s02 .s02-accent-word {
          color: var(--rf-accent, #9c7cff);
          will-change: opacity;
        }

        #v7s-s02 .s02-subline {
          position: absolute;
          z-index: 6;
          top: calc(60% + 7.2vw);
          left: 7.4%;
          margin: 0;
          color: var(--rf-text, #f7f7f4);
          font-family: var(--rf-font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
          font-size: 21px;
          font-weight: 600;
          letter-spacing: 0.14em;
          line-height: 1;
          white-space: nowrap;
          will-change: opacity, transform;
        }

        #v7s-s02 .s02-chrome,
        #v7s-s02 .s02-tag {
          margin: 0;
          color: var(--rf-ink-subtle, #9297a2);
          font-family: var(--rf-font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
          font-size: 13px;
          font-weight: 400;
          letter-spacing: 0.14em;
          line-height: 1;
          white-space: nowrap;
          will-change: opacity, transform;
        }

        #v7s-s02 .s02-chrome {
          position: absolute;
          z-index: 8;
          top: 8%;
          left: 7.4%;
        }

        #v7s-s02 .s02-tag {
          position: absolute;
          z-index: 7;
        }

        #v7s-s02 .s02-tag::before {
          position: absolute;
          top: 50%;
          width: 42px;
          height: 1px;
          background: var(--rf-hairline, rgba(255, 255, 255, 0.13));
          content: "";
          transform: translateY(-50%);
        }

        #v7s-s02 .s02-tag--fps {
          top: 8%;
          right: 7.4%;
          padding-left: 54px;
        }

        #v7s-s02 .s02-tag--fps::before {
          left: 0;
        }

        #v7s-s02 .s02-tag--bleed {
          top: 87%;
          right: 7.4%;
          padding-right: 54px;
          text-align: right;
        }

        #v7s-s02 .s02-tag--bleed::before {
          right: 0;
        }

        #v7s-s02 .s02-marker {
          position: absolute;
          z-index: 9;
          top: 60%;
          left: 28.34%;
          width: 1px;
          height: 13px;
          background: var(--rf-accent, #9c7cff);
          opacity: 0;
          transform: translate(-0.5px, -50%) scale(1);
          transform-origin: 50% 50%;
          will-change: left, opacity, transform;
        }

        #v7s-s02 .s02-progress {
          position: absolute;
          z-index: 8;
          top: 92%;
          left: 0;
          width: 100%;
          height: 1px;
          background: var(--rf-hairline, rgba(255, 255, 255, 0.13));
          will-change: opacity, transform;
        }

        #v7s-s02 .s02-progress-marker {
          position: absolute;
          top: 50%;
          left: 25%;
          width: 1px;
          height: 13px;
          background: var(--rf-text, #f7f7f4);
          transform: translate(-50%, -50%);
        }

        @keyframes s02-stage-breathe {
          from {
            filter: brightness(1);
          }
          to {
            filter: brightness(1.24);
          }
        }
      </style>

      <main id="v7s-s02" data-rf-fragment-version="1.0" data-composition-id="v7s-s02">
        <div class="s02-stage" aria-hidden="true"></div>
        <div class="s02-ghost-field" aria-hidden="true">
          <p class="s02-ghost s02-ghost--one">영상 한 편.</p>
          <p class="s02-ghost s02-ghost--two">영상 한 편.</p>
          <p class="s02-ghost s02-ghost--three">영상 한 편.</p>
        </div>
        <div class="s02-blinds" aria-hidden="true">
          <span class="s02-blind s02-blind--one"></span>
          <span class="s02-blind s02-blind--two"></span>
          <span class="s02-blind s02-blind--three"></span>
        </div>
        <div class="s02-scan" aria-hidden="true"></div>

        <p class="s02-chrome">02 — FORMAT</p>
        <p class="s02-tag s02-tag--fps">30FPS</p>
        <p class="s02-tag s02-tag--bleed">FULL-BLEED</p>

        <h1 class="s02-copy s02-copy--base">영상 한 편.</h1>
        <h1 class="s02-copy s02-copy--reveal" aria-hidden="true">영상 한 편.</h1>
        <h1 class="s02-accent-actor" aria-hidden="true"><span class="s02-accent-filler">영상 </span><span class="s02-accent-word">한 편</span><span class="s02-accent-filler">.</span></h1>
        <p class="s02-subline">FULL-BLEED</p>
        <span class="s02-marker" aria-hidden="true"></span>

        <div class="s02-progress" aria-hidden="true">
          <span class="s02-progress-marker"></span>
        </div>
      </main>

      <script>
        (() => {
          const compositionId = "v7s-s02";
          const root = document.querySelector(`[data-composition-id="${compositionId}"]`);
          if (!root) return;

          const chrome = root.querySelector(".s02-chrome");
          const tags = Array.from(root.querySelectorAll(".s02-tag"));
          const progress = root.querySelector(".s02-progress");
          const subline = root.querySelector(".s02-subline");
          const reveal = root.querySelector(".s02-copy--reveal");
          const accentWord = root.querySelector(".s02-accent-word");
          const marker = root.querySelector(".s02-marker");
          const scan = root.querySelector(".s02-scan");
          const ghosts = Array.from(root.querySelectorAll(".s02-ghost"));
          const blinds = Array.from(root.querySelectorAll(".s02-blind"));

          window.__timelines = window.__timelines || {};
          const tl = gsap.timeline({ paused: true });

          tl.set([chrome, progress, subline, ...tags], { opacity: 0 })
            .set(reveal, { clipPath: "inset(0 100% 0 0)" })
            .set(blinds, { xPercent: 0, yPercent: 0, scaleX: 1, opacity: 1, transformOrigin: "50% 50%" })
            .set(scan, { opacity: 0.025 })
            .set(accentWord, { opacity: 1 })
            .set(marker, { opacity: 0, left: "28.34%", top: "60%", scale: 1, transformOrigin: "50% 50%" })
            .fromTo(chrome, { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.18, ease: "power3.out" }, 0)
            .fromTo(progress, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.18, ease: "power3.out" }, 0)
            .fromTo(tags, { opacity: 0, x: 14 }, { opacity: 1, x: 0, duration: 0.2, stagger: 0.04, ease: "power3.out" }, 0.04)
            .to(blinds[0], { xPercent: -45, yPercent: -2, scaleX: 0.21, opacity: 0.44, duration: 0.5, ease: "power4.inOut" }, 0)
            .to(blinds[1], { yPercent: 2, scaleX: 0.12, opacity: 0.4, duration: 0.5, ease: "power4.inOut" }, 0)
            .to(blinds[2], { xPercent: 45, yPercent: -2, scaleX: 0.21, opacity: 0.44, duration: 0.5, ease: "power4.inOut" }, 0)
            .to(scan, { opacity: 0.22, duration: 0.025, ease: "none" }, 0.375)
            .to(scan, { opacity: 0.075, duration: 0.125, ease: "power2.out" }, 0.4)
            .to(reveal, { clipPath: "inset(0 0% 0 0)", duration: 0.125, ease: "power4.out" }, 0.375)
            .fromTo(subline, { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.2, ease: "power3.out" }, 0.375)
            .to(ghosts[0], { xPercent: -1.5, duration: 0.75, ease: "none" }, 0.375)
            .to(ghosts[1], { xPercent: 1, duration: 0.75, ease: "none" }, 0.375)
            .set(accentWord, { opacity: 0 }, 0.75)
            .set(marker, { opacity: 1 }, 0.75)
            .to(marker, { left: "7.4%", scale: 1, duration: 0.375, ease: "power3.inOut" }, 0.75)
            .to(blinds, { opacity: 0.2, duration: 0.375, stagger: 0.03, ease: "power1.out" }, 1.125);

          window.__timelines[compositionId] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>
