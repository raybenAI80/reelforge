<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>ReelForge v7 — Camera</title>
  </head>
  <body>
    <template>
      <style>
        .rf-v7s-s04 {
          position: absolute;
          inset: 0;
          overflow: hidden;
          color: var(--rf-text, #ffffff);
          font-family: var(--rf-font-sans, "Pretendard", system-ui, sans-serif);
        }

        .rf-v7s-s04 .s04-stage {
          position: absolute;
          inset: 0;
          overflow: hidden;
          isolation: isolate;
          will-change: transform, opacity, filter;
        }

        .rf-v7s-s04 .s04-ground {
          position: absolute;
          inset: 0;
          background: var(--rf-bg, #010102);
        }

        .rf-v7s-s04 .s04-breathe {
          position: absolute;
          inset: 0;
          background: var(--rf-surface-2, #121317);
          opacity: 0.14;
          filter: brightness(1);
          animation: s04-breathe 1.02s ease-in-out calc(var(--rf-scene-start, 0s) + 1.2s) infinite alternate;
          will-change: opacity, filter;
        }

        .rf-v7s-s04 .s04-camera {
          position: absolute;
          inset: 0;
          perspective: 930px;
          perspective-origin: 51% 50%;
        }

        .rf-v7s-s04 .s04-rig,
        .rf-v7s-s04 .s04-plane,
        .rf-v7s-s04 .s04-hero {
          transform-style: preserve-3d;
        }

        .rf-v7s-s04 .s04-rig,
        .rf-v7s-s04 .s04-plane,
        .rf-v7s-s04 .s04-hero {
          position: absolute;
          inset: 0;
        }

        .rf-v7s-s04 .s04-plane {
          pointer-events: none;
          will-change: transform, opacity;
        }

        .rf-v7s-s04 .s04-rule {
          position: absolute;
          width: 1px;
          height: 136%;
          background: var(--rf-hairline, #26272e);
        }

        .rf-v7s-s04 .s04-rule--far {
          top: -18%;
          left: 49.8%;
          transform: rotate(7deg);
        }

        .rf-v7s-s04 .s04-rule--mid {
          top: -18%;
          left: 74.2%;
          transform: rotate(-5deg);
        }

        .rf-v7s-s04 .s04-cross-rule {
          position: absolute;
          top: 38.2%;
          left: -9%;
          width: 118%;
          height: 1px;
          background: var(--rf-hairline, #26272e);
          transform: rotate(-3deg);
        }

        .rf-v7s-s04 .s04-micro {
          position: absolute;
          margin: 0;
          color: var(--rf-ink-subtle, #8a8f98);
          font-family: var(--rf-font-mono, "Pretendard Mono Fallback", ui-monospace, monospace);
          font-size: 13px;
          font-weight: 400;
          letter-spacing: 0.1em;
          line-height: 1;
          white-space: nowrap;
        }

        .rf-v7s-s04 .s04-micro--far {
          top: 17.2%;
          left: 51.3%;
          transform: rotate(-3deg);
        }

        .rf-v7s-s04 .s04-micro--mid {
          top: 76.1%;
          left: 75.6%;
          transform: rotate(-5deg);
        }

        .rf-v7s-s04 .s04-micro--cross {
          top: 35.8%;
          left: 10.2%;
          transform: rotate(-3deg);
        }

        .rf-v7s-s04 .s04-hero {
          z-index: 2;
          pointer-events: none;
        }

        .rf-v7s-s04 .s04-hero-line {
          position: absolute;
          left: 7.4%;
          display: block;
          width: max-content;
          margin: 0;
          color: var(--rf-text, #ffffff);
          font-family: var(--rf-font-sans, "Pretendard", system-ui, sans-serif);
          font-size: clamp(120px, 10vw, 190px);
          font-weight: 800;
          letter-spacing: -0.045em;
          line-height: 0.96;
          white-space: nowrap;
          word-break: keep-all;
          will-change: transform, opacity;
        }

        .rf-v7s-s04 .s04-hero-line--one {
          top: 30.2%;
        }

        .rf-v7s-s04 .s04-hero-line--two {
          top: 47.2%;
        }

        .rf-v7s-s04 .s04-chrome {
          position: absolute;
          z-index: 5;
          color: var(--rf-ink-subtle, #8a8f98);
          font-family: var(--rf-font-mono, "Pretendard Mono Fallback", ui-monospace, monospace);
          font-size: 13px;
          font-weight: 400;
          letter-spacing: 0.1em;
          line-height: 1;
        }

        .rf-v7s-s04 .s04-section {
          top: 8%;
          left: 7.4%;
          margin: 0;
        }

        .rf-v7s-s04 .s04-progress {
          position: absolute;
          right: 7.4%;
          bottom: 8%;
          left: 7.4%;
          height: 13px;
        }

        .rf-v7s-s04 .s04-progress-line {
          position: absolute;
          right: 0;
          bottom: 0;
          left: 0;
          height: 1px;
          background: var(--rf-hairline, #26272e);
        }

        .rf-v7s-s04 .s04-progress-tick {
          position: absolute;
          bottom: -6px;
          width: 1px;
          height: 13px;
          background: var(--rf-hairline, #26272e);
        }

        .rf-v7s-s04 .s04-progress-marker {
          position: absolute;
          bottom: -8px;
          left: 50%;
          width: 1px;
          height: 17px;
          background: var(--rf-accent, #828fff);
          transform: translateX(-0.5px);
        }

        .rf-v7s-s04 .s04-progress-readout {
          position: absolute;
          right: 0;
          bottom: 17px;
          margin: 0;
        }

        @keyframes s04-breathe {
          from {
            opacity: 0.14;
            filter: brightness(1);
          }
          to {
            opacity: 0.22;
            filter: brightness(1.24);
          }
        }
      </style>
      <main class="rf-v7s-s04" data-rf-fragment-version="1.0" data-composition-id="v7s-s04">
        <svg aria-hidden="true" style="position: absolute; width: 0; height: 0">
          <filter id="v7s-s04-whip-blur" x="-55%" y="-55%" width="210%" height="210%">
            <feGaussianBlur stdDeviation="0 0"></feGaussianBlur>
          </filter>
        </svg>
        <div class="s04-stage">
          <div class="s04-ground" aria-hidden="true"></div>
          <div class="s04-breathe" aria-hidden="true"></div>
          <div class="s04-camera" aria-hidden="true">
            <div class="s04-rig">
              <div class="s04-plane s04-plane--far">
                <span class="s04-rule s04-rule--far"></span>
                <p class="s04-micro s04-micro--far">FOCAL / -620</p>
              </div>
              <div class="s04-plane s04-plane--mid">
                <span class="s04-rule s04-rule--mid"></span>
                <span class="s04-cross-rule"></span>
                <p class="s04-micro s04-micro--mid">DEPTH / -250</p>
                <p class="s04-micro s04-micro--cross">CAMERA AXIS / 04</p>
              </div>
              <h1 class="s04-hero">
                <span class="s04-hero-line s04-hero-line--one">글자 사이로</span>
                <span class="s04-hero-line s04-hero-line--two">카메라가 간다</span>
              </h1>
            </div>
          </div>
          <p class="s04-chrome s04-section">04 — CAMERA</p>
          <div class="s04-progress" aria-label="scene 4 of 8 progress">
            <p class="s04-chrome s04-progress-readout">04 / 08</p>
            <span class="s04-progress-line"></span>
            <span class="s04-progress-tick" style="left: 0%"></span>
            <span class="s04-progress-tick" style="left: 12.5%"></span>
            <span class="s04-progress-tick" style="left: 25%"></span>
            <span class="s04-progress-tick" style="left: 37.5%"></span>
            <span class="s04-progress-tick" style="left: 50%"></span>
            <span class="s04-progress-tick" style="left: 62.5%"></span>
            <span class="s04-progress-tick" style="left: 75%"></span>
            <span class="s04-progress-tick" style="left: 87.5%"></span>
            <span class="s04-progress-tick" style="left: 100%"></span>
            <span class="s04-progress-marker"></span>
          </div>
        </div>
      </main>
      <script>
        (() => {
          const compositionId = "v7s-s04";
          const root = document.querySelector(`[data-composition-id="${compositionId}"]`);
          if (!root) return;

          const blur = root.querySelector("#v7s-s04-whip-blur feGaussianBlur");
          const stage = root.querySelector(".s04-stage");
          const rig = root.querySelector(".s04-rig");
          const farPlane = root.querySelector(".s04-plane--far");
          const midPlane = root.querySelector(".s04-plane--mid");
          const heroOne = root.querySelector(".s04-hero-line--one");
          const heroTwo = root.querySelector(".s04-hero-line--two");

          window.__timelines = window.__timelines || {};
          window.__anchors = window.__anchors || {};
          window.__anchors[compositionId] = {
            exit: { dir: "right", blurPeak: 40, cx: 0.5, cy: 0.5, handoffAnchor: "right-whip-out" }
          };

          const tl = gsap.timeline({ paused: true });

          tl.set(stage, { filter: "url(#v7s-s04-whip-blur)", x: 0, skewX: 0, opacity: 1 }, 0)
            .set(blur, { attr: { stdDeviation: "0 0" } }, 0)
            .set(rig, { z: 0, transformStyle: "preserve-3d" }, 0)
            .set([farPlane, midPlane], { transformStyle: "preserve-3d" }, 0)
            .set(farPlane, { z: -620, x: -28, opacity: 0.35 }, 0)
            .set(midPlane, { z: -250, x: 22, opacity: 0.42 }, 0)
            .set(heroOne, { z: 0, y: 18, scale: 0.985, opacity: 0.26, transformOrigin: "left center" }, 0)
            .set(heroTwo, { z: 130, y: 24, scale: 0.98, opacity: 0.26, transformOrigin: "left center" }, 0)
            .to(rig, { z: 355, duration: 1.78, ease: "power2.inOut" }, 0.14)
            .to(farPlane, { x: 0, opacity: 0.9, duration: 0.34, ease: "power2.out" }, 0)
            .to(midPlane, { x: 0, opacity: 0.82, duration: 0.38, ease: "power2.out" }, 0.12)
            .to(heroOne, { y: 0, scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, 0)
            .to(heroTwo, { y: 0, scale: 1, opacity: 1, duration: 0.36, ease: "power3.out" }, 0.15)
            .to(stage, { x: -18, duration: 0.12, ease: "power2.in" }, 3.615)
            .to(blur, { attr: { stdDeviation: "40 2" }, duration: 0.11, ease: "power4.in" }, 3.735)
            .to(stage, { x: 2320, skewX: -9, duration: 0.35, ease: "power4.in" }, 3.735)
            .to(stage, { opacity: 0.42, duration: 0.31, ease: "power3.in" }, 3.775);

          window.__timelines[compositionId] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>
