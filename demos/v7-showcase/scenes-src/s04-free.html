      <script>
        (() => {
          const compositionId = "v7s-s04";
          const root = document.querySelector(`[data-composition-id="${compositionId}"]`);
          if (!root) return;

          const stage = root.querySelector(".s04-stage");
          const blur = root.querySelector("#v7s-s04-whip-blur feGaussianBlur");
          const value = root.querySelector(".s04-value");
          const runner = root.querySelector(".s04-runner");
          const flash = root.querySelector(".s04-flash");
          const ghosts = Array.from(root.querySelectorAll(".s04-ghost"));
          const ticks = Array.from(root.querySelectorAll(".s04-tick"));
          const counter = { value: 0 };
          const target = Number(value.getAttribute("data-target"));

          value.textContent = "0";
          window.__timelines = window.__timelines || {};
          window.__anchors = window.__anchors || {};
          window.__anchors[compositionId] = {
            exit: { dir: "right", blurPeak: 38, x: 0.074, y: 0.6, handoffAnchor: "right-whip-out" }
          };

          const tl = gsap.timeline({ paused: true });

          tl.set(stage, { x: 0, skewX: 0, opacity: 1 }, 0)
            .set(blur, { attr: { stdDeviation: "0 0" } }, 0)
            .set(ticks, { opacity: 0.16, scaleY: 0.22, transformOrigin: "center bottom" }, 0)
            .set(ghosts, { opacity: 0.12, x: -110, y: 64, transformOrigin: "center" }, 0)
            .set(runner, { x: 0, y: 0, scaleY: 0.34, transformOrigin: "center" }, 0)
            .set(flash, { opacity: 0 }, 0)
            .to(ghosts, { opacity: (index) => (index === 0 ? 0.68 : 0.34), x: 0, y: 0, duration: 0.375, ease: "power4.out", stagger: 0.04 }, 0)
            .to(value, { scale: 1.055, duration: 0.075, ease: "power2.out", transformOrigin: "left 60%" }, 0)
            .to(value, { scale: 1, duration: 0.3, ease: "expo.out" }, 0.075)
            .to(counter, {
              value: target,
              duration: 0.9,
              ease: "none",
              onUpdate: () => {
                value.textContent = String(Math.min(target, Math.round(counter.value)));
              }
            }, 0)
            .to(ticks, { opacity: 1, scaleY: 1, duration: 0.025, ease: "none", stagger: 0.025 }, 0.125)
            .to(runner, { x: 1728, y: -680, scaleY: 1, duration: 0.9, ease: "none" }, 0)
            .to(flash, { opacity: 0.1, duration: 0.025, ease: "none" }, 0.75)
            .to(flash, { opacity: 0, duration: 0.125, ease: "power2.out" }, 0.775)
            .to(value, { x: 18, duration: 0.075, ease: "power2.in" }, 0.75)
            .to(value, { x: 0, duration: 0.075, ease: "power2.out" }, 0.825)
            .to(stage, { x: -20, duration: 0.075, ease: "power2.in" }, 1.5)
            .to(blur, { attr: { stdDeviation: "38 2" }, duration: 0.1, ease: "power4.in" }, 1.575)
            .to(stage, { x: 2360, skewX: -9, duration: 0.325, ease: "power4.in" }, 1.575)
            .to(stage, { opacity: 0.42, duration: 0.28, ease: "power3.in" }, 1.62);

          window.__timelines[compositionId] = tl;
          tl.seek(0);
        })();
