      <script>
          (() => {
            const compositionId = "v7s-s05";
            const root = document.querySelector(`[data-composition-id="${compositionId}"]`);
            if (!root) return;

            const stage = root.querySelector(".s05-stage");
            const ghostField = root.querySelector(".s05-ghost-field");
            const whipField = root.querySelector(".s05-whip-field");
            const heroFrame = root.querySelector(".s05-hero-frame");
            const subline = root.querySelector(".s05-subline");
            const micro = root.querySelectorAll(".s05-micro");
            const chrome = root.querySelectorAll(".s05-chrome, .s05-progress");
            const marker = root.querySelector(".s05-progress-marker");
            const flash = root.querySelector(".s05-flash");

            window.__timelines = window.__timelines || {};
            window.__anchors = window.__anchors || {};
            window.__anchors[compositionId] = {
              enter: { dir: "right", cx: 0.5, cy: 0.6, handoffAnchor: "right-whip-in" },
              exit: { cx: 0.5, cy: 0.6, handoffAnchor: "center-slam" }
            };

            const tl = gsap.timeline({ paused: true });

            tl.addLabel("whip-in", 0)
              .addLabel("slam", 0.375)
              .set(stage, { x: 216, skewX: -3, transformOrigin: "right center" }, 0)
              .set(heroFrame, { xPercent: -50, x: -216, y: 24, scale: 0.66, opacity: 0.88, transformOrigin: "center center" }, 0)
              .set(ghostField, { x: 540, y: 0, filter: "brightness(0.8)" }, 0)
              .set(whipField, { x: 680, skewX: -10, filter: "blur(12px)", transformOrigin: "right center" }, 0)
              .set([subline, micro, chrome], { opacity: 0, y: 12 }, 0)
              .set(marker, { opacity: 0, scaleY: 0.4, transformOrigin: "center center" }, 0)
              .set(flash, { opacity: 0 }, 0)
              .to(stage, { x: 0, skewX: 0, duration: 0.375, ease: "power4.out" }, "whip-in")
              .to(heroFrame, { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.375, ease: "back.out(2.6)" }, "whip-in")
              .to(ghostField, { x: 0, duration: 0.375, ease: "power4.out" }, "whip-in")
              .to(whipField, { x: 0, skewX: 0, filter: "blur(0px)", duration: 0.375, ease: "power4.out" }, "whip-in")
              .to([subline, micro, chrome], { opacity: 1, y: 0, duration: 0.225, stagger: 0.018, ease: "power3.out" }, 0.075)
              .to(marker, { opacity: 1, scaleY: 1, duration: 0.18, ease: "power3.out" }, 0.15)
              .to(flash, { opacity: 0.48, duration: 0.045, ease: "none" }, "slam")
              .to(flash, { opacity: 0, duration: 0.075, ease: "power2.out" }, 0.42)
              .to(ghostField, { filter: "brightness(2.1)", duration: 0.045, ease: "none" }, "slam")
              .to(ghostField, { filter: "brightness(1)", duration: 0.18, ease: "power2.out" }, 0.42)
              .to(stage, { x: -14, duration: 0.03, ease: "none" }, "slam")
              .to(stage, { x: 10, duration: 0.03, ease: "none" }, 0.405)
              .to(stage, { x: -6, duration: 0.03, ease: "none" }, 0.435)
              .to(stage, { x: 0, duration: 0.03, ease: "none" }, 0.465)
              .to(ghostField, { y: -16, duration: 0.375, ease: "power1.inOut" }, 0.75)
              .to(whipField, { x: -54, duration: 0.375, ease: "power1.inOut" }, 0.75)
              .to([subline, micro], { y: -4, duration: 0.18, ease: "power1.out" }, 1.125);

            window.__timelines[compositionId] = tl;
            tl.seek(0);
          })();
      </script>
