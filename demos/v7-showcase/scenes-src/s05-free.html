<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>v7 showcase — cut on the beat</title>
  </head>
  <body>
    <template>
      <style>
        .v7s-s05 {
          position: absolute;
          inset: 0;
          overflow: hidden;
          color: var(--rf-text, #f8f7f2);
          font-family: var(--rf-font-sans, "Pretendard", system-ui, sans-serif);
          background: var(--rf-bg, #090a0d);
        }

        .v7s-s05 .s05-stage,
        .v7s-s05 .s05-stage-plane,
        .v7s-s05 .s05-strobe {
          position: absolute;
          inset: 0;
        }

        .v7s-s05 .s05-stage {
          overflow: hidden;
          isolation: isolate;
          will-change: transform, filter;
        }

        .v7s-s05 .s05-stage-plane {
          z-index: 0;
          background: var(--rf-bg, #090a0d);
          animation: s05-stage-breathe 1.02s ease-in-out calc(var(--rf-scene-start, 0s) + 1.2s) infinite alternate;
          will-change: filter, opacity;
        }

        .v7s-s05 .s05-strobe {
          z-index: 4;
          pointer-events: none;
          background: var(--rf-accent, #ff4f87);
          opacity: 0;
          will-change: opacity;
        }

        .v7s-s05 .s05-chrome {
          position: absolute;
          z-index: 5;
          top: 8%;
          left: 7.4%;
          margin: 0;
          color: var(--rf-ink-subtle, #8d929c);
          font-family: var(--rf-font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
          font-size: 13px;
          font-weight: 400;
          letter-spacing: 0.14em;
          line-height: 1;
          white-space: nowrap;
        }

        .v7s-s05 .s05-copy {
          position: absolute;
          z-index: 3;
          top: calc(60% - 1.72em);
          left: 7.4%;
          display: flex;
          flex-direction: column;
          align-items: flex-start;
          margin: 0;
          font-family: var(--rf-font-sans, "Pretendard", system-ui, sans-serif);
          font-size: clamp(120px, 10vw, 190px);
          font-weight: 800;
          letter-spacing: -0.045em;
          line-height: 0.96;
          white-space: nowrap;
          word-break: keep-all;
          transform-origin: left center;
          will-change: transform;
        }

        .v7s-s05 .s05-line {
          display: block;
          will-change: transform, opacity;
        }

        .v7s-s05 .s05-progress {
          position: absolute;
          z-index: 5;
          top: 92%;
          right: 0;
          left: 0;
          height: 1px;
          background: var(--rf-hairline, #292b31);
        }

        .v7s-s05 .s05-progress-marker {
          position: absolute;
          top: -2px;
          left: calc(62.5% - 1px);
          width: 2px;
          height: 5px;
          background: var(--rf-text, #f8f7f2);
          will-change: transform;
        }

        @keyframes s05-stage-breathe {
          from {
            filter: brightness(1);
            opacity: 0.86;
          }

          to {
            filter: brightness(1.24);
            opacity: 1;
          }
        }
      </style>
      <main class="v7s-s05" data-rf-fragment-version="1.0" data-composition-id="v7s-s05">
        <svg aria-hidden="true" style="position: absolute; width: 0; height: 0">
          <filter id="v7s-s05-whip-blur" x="-55%" y="-55%" width="210%" height="210%">
            <feGaussianBlur stdDeviation="40 2"></feGaussianBlur>
          </filter>
        </svg>
        <div class="s05-stage">
          <div class="s05-stage-plane" aria-hidden="true"></div>
          <div class="s05-strobe" aria-hidden="true"></div>
          <p class="s05-chrome">05 — CUT</p>
          <h1 class="s05-copy" aria-label="비트 위에서 잘린다">
            <span class="s05-line s05-line--first">비트 위에서</span>
            <span class="s05-line s05-line--second">잘린다</span>
          </h1>
          <div class="s05-progress" aria-hidden="true">
            <span class="s05-progress-marker"></span>
          </div>
        </div>
      </main>
      <script>
        (() => {
          const compositionId = "v7s-s05";
          const root = document.querySelector(`[data-composition-id="${compositionId}"]`);
          if (!root) return;

          const blur = root.querySelector("#v7s-s05-whip-blur feGaussianBlur");
          const stage = root.querySelector(".s05-stage");
          const first = root.querySelector(".s05-line--first");
          const second = root.querySelector(".s05-line--second");
          const strobe = root.querySelector(".s05-strobe");

          window.__timelines = window.__timelines || {};
          window.__anchors = window.__anchors || {};
          window.__anchors[compositionId] = {
            enter: { dir: "right", blurPeak: 40, x: 0.074, y: 0.6, handoffAnchor: "right-whip-in" },
            exit: { x: 0.074, y: 0.6, handoffAnchor: "hero-baseline-left" }
          };

          const tl = gsap.timeline({ paused: true });

          tl.set(stage, { filter: "url(#v7s-s05-whip-blur)", x: 2360, skewX: -9 })
            .set(blur, { attr: { stdDeviation: "40 2" } })
            .set(first, { opacity: 0, x: 104, skewX: -12, transformOrigin: "left center" })
            .set(second, { opacity: 0, x: 132, y: -22, scale: 0.78, skewX: -12, transformOrigin: "left center" })
            .set(strobe, { opacity: 0 })
            .to(stage, { x: 42, skewX: -1.5, duration: 0.21, ease: "power4.out" }, 0)
            .to(blur, { attr: { stdDeviation: "0 0" }, duration: 0.19, ease: "power4.out" }, 0)
            .to(stage, { x: 0, skewX: 0, duration: 0.12, ease: "power2.out" }, 0.33)
            .to(first, { opacity: 1, x: 0, skewX: 0, duration: 0.32, ease: "power4.out" }, 0.12)
            .to(second, { opacity: 1, x: 0, y: 0, scale: 1, skewX: 0, duration: 0.27, ease: "back.out(1.9)" }, 0.5106)
            .to(strobe, { opacity: 0.42, duration: 0.055, ease: "none" }, 1.0212)
            .to(strobe, { opacity: 0, duration: 0.11, ease: "power2.out" }, 1.0762)
            .to(stage, { x: -14, duration: 0.03, ease: "none" }, 1.0212)
            .to(stage, { x: 10, duration: 0.03, ease: "none" }, 1.0512)
            .to(stage, { x: -6, duration: 0.03, ease: "none" }, 1.0812)
            .to(stage, { x: 0, duration: 0.03, ease: "none" }, 1.1112);

          window.__timelines[compositionId] = tl;
          tl.seek(0);
        })();
      </script>
    </template>
  </body>
</html>
