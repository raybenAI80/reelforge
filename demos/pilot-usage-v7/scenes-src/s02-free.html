<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Pilot s02</title>
  </head>
  <body>
    <template>
      <style>
        #pilot-s02 {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: var(--rf-bg, #08080b);
          color: var(--rf-text, #f8f7f2);
          font-family: var(--rf-font-sans, "Pretendard", "Noto Sans KR", system-ui, sans-serif);
        }

        #pilot-s02 .s02-underlay,
        #pilot-s02 .s02-plane,
        #pilot-s02 .s02-grain,
        #pilot-s02 .s02-glow,
        #pilot-s02 .s02-ray {
          position: absolute;
          inset: 0;
          pointer-events: none;
        }

        #pilot-s02 .s02-underlay {
          background:
            radial-gradient(ellipse 76% 88% at 91% 14%, var(--rf-surface-3, #25292a) 0%, var(--rf-transparent, transparent) 64%),
            radial-gradient(ellipse 52% 64% at 7% 94%, var(--rf-surface-2, #1a1d1e) 0%, var(--rf-transparent, transparent) 70%),
            linear-gradient(118deg, var(--rf-bg, #08080b) 0%, var(--rf-surface-2, #1a1d1e) 100%);
        }

        #pilot-s02 .s02-plane {
          overflow: hidden;
          clip-path: inset(0 100% 0 0);
          background:
            radial-gradient(ellipse 64% 82% at 77% 34%, var(--rf-surface-3, #25292a) 0%, var(--rf-transparent, transparent) 66%),
            radial-gradient(ellipse 56% 76% at 16% 104%, var(--rf-surface-2, #1a1d1e) 0%, var(--rf-transparent, transparent) 72%),
            linear-gradient(119deg, var(--rf-bg, #08080b) 0%, var(--rf-surface-2, #1a1d1e) 57%, var(--rf-bg, #08080b) 100%);
          will-change: clip-path;
        }

        #pilot-s02 .s02-grain {
          opacity: 0.26;
          background-image:
            repeating-linear-gradient(100deg, var(--rf-transparent, transparent) 0 17px, var(--rf-hairline, rgba(255, 255, 255, 0.14)) 18px 19px, var(--rf-transparent, transparent) 20px 67px),
            repeating-linear-gradient(0deg, var(--rf-transparent, transparent) 0 7px, var(--rf-hairline, rgba(255, 255, 255, 0.14)) 8px 9px, var(--rf-transparent, transparent) 10px 31px);
          mask-image: linear-gradient(112deg, var(--rf-transparent, transparent) 0%, var(--rf-text, #f8f7f2) 42%, var(--rf-transparent, transparent) 100%);
          transform: scale(1.18) rotate(-4deg);
        }

        #pilot-s02 .s02-glow {
          inset: -25% 13% -32% -19%;
          background: radial-gradient(ellipse at center, var(--rf-accent, #6ee7d8) 0%, var(--rf-transparent, transparent) 67%);
          filter: blur(104px) brightness(1);
          opacity: 0.16;
          animation: pilot-s02-radiate 2.6s ease-in-out infinite alternate;
          animation-delay: calc(var(--rf-scene-start, 0s) + 1.2s);
        }

        #pilot-s02 .s02-ray {
          top: -28%;
          right: 10%;
          bottom: -28%;
          left: auto;
          width: 18%;
          background: linear-gradient(180deg, var(--rf-transparent, transparent) 0%, var(--rf-accent-alt, #e8a653) 47%, var(--rf-transparent, transparent) 100%);
          filter: blur(48px) brightness(1);
          opacity: 0.14;
          transform: rotate(27deg);
          transform-origin: center;
          animation: pilot-s02-ray-pulse 2.2s ease-in-out infinite alternate;
          animation-delay: calc(var(--rf-scene-start, 0s) + 1.2s);
        }

        #pilot-s02 .s02-headline {
          position: absolute;
          top: 31.4%;
          left: 5.15%;
          z-index: 1;
          margin: 0;
          color: var(--rf-text, #f8f7f2);
          font-size: clamp(146px, 10.8vw, 216px);
          font-weight: 800;
          letter-spacing: -0.093em;
          line-height: 0.86;
          white-space: nowrap;
          text-shadow: 0 0 48px var(--rf-accent-shadow, rgba(110, 231, 216, 0.16));
          will-change: transform, opacity;
        }

        #pilot-s02 .s02-condition {
          position: absolute;
          z-index: 1;
          margin: 0;
          color: var(--rf-muted-text, #c9ceca);
          font-family: var(--rf-font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
          font-weight: 700;
          letter-spacing: -0.075em;
          line-height: 1;
          white-space: nowrap;
          will-change: transform, opacity;
        }

        #pilot-s02 .s02-condition--product {
          top: 14.2%;
          left: 7.25%;
          font-size: clamp(34px, 2.6vw, 50px);
        }

        #pilot-s02 .s02-condition--tone {
          bottom: 12.8%;
          left: 16.3%;
          color: var(--rf-ink-secondary, #aeb5b2);
          font-size: clamp(23px, 1.8vw, 35px);
        }

        #pilot-s02 .s02-condition--ratio {
          right: 8.2%;
          bottom: 29.4%;
          color: var(--rf-accent-alt, #e8a653);
          font-size: clamp(56px, 5.1vw, 98px);
          letter-spacing: -0.11em;
        }

        @keyframes pilot-s02-radiate {
          from {
            filter: blur(104px) brightness(1);
            opacity: 0.16;
          }
          to {
            filter: blur(104px) brightness(1.28);
            opacity: 0.44;
          }
        }

        @keyframes pilot-s02-ray-pulse {
          from {
            filter: blur(48px) brightness(1);
            opacity: 0.14;
          }
          to {
            filter: blur(48px) brightness(1.24);
            opacity: 0.38;
          }
        }
      </style>
      <main
        id="pilot-s02"
        data-rf-fragment-version="1.0"
        data-composition-id="pilot-s02"
      >
        <div class="s02-underlay"></div>
        <section class="s02-plane" aria-label="한 줄을 읽는다">
          <div class="s02-grain"></div>
          <div class="s02-glow"></div>
          <div class="s02-ray"></div>
          <h1 class="s02-headline">한 줄을 읽는다</h1>
          <p class="s02-condition s02-condition--product">30초 제품 소개</p>
          <p class="s02-condition s02-condition--tone">차분한 톤</p>
          <p class="s02-condition s02-condition--ratio">16:9</p>
        </section>
      </main>
      <script>
        const root = document.querySelector('[data-composition-id="pilot-s02"]');
        const plane = root.querySelector(".s02-plane");
        const headline = root.querySelector(".s02-headline");
        const product = root.querySelector(".s02-condition--product");
        const tone = root.querySelector(".s02-condition--tone");
        const ratio = root.querySelector(".s02-condition--ratio");
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        tl.set(plane, { clipPath: "inset(0 100% 0 0)" }, 0)
          .set(headline, { opacity: 0, x: -44 }, 0)
          .set(product, { opacity: 0, y: -18 }, 0)
          .set(tone, { opacity: 0, y: 18 }, 0)
          .set(ratio, { opacity: 0, x: 34 }, 0)
          .to(plane, { clipPath: "inset(0 0% 0 0)", duration: 0.84, ease: "power3.inOut" }, 0)
          .to(headline, { opacity: 1, x: 0, duration: 0.46, ease: "power3.out" }, 0.42)
          .to(product, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 0.78)
          .to(ratio, { opacity: 1, x: 0, duration: 0.32, ease: "power2.out" }, 1.08)
          .to(tone, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 1.37);

        window.__timelines["pilot-s02"] = tl;
        tl.seek(0);
      </script>
    </template>
  </body>
</html>
