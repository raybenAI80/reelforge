<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Gallery harness scene</title>
  </head>
  <body>
    <template>
      <style>
        #gallery-harness-s01 {
          position: absolute;
          inset: 0;
          display: grid;
          place-items: center;
          overflow: hidden;
          color: var(--rf-text, #f8f7f2);
          font-family: "Pretendard", system-ui, sans-serif;
        }

        #gallery-harness-s01 .stage {
          position: absolute;
          inset: 0;
          background: var(--rf-bg, #111216);
        }

        #gallery-harness-s01 .glow {
          position: absolute;
          width: 56vw;
          height: 56vw;
          border-radius: 50%;
          background: var(--rf-accent, #6ee7d8);
          filter: blur(120px) brightness(0.88);
          opacity: 0.32;
          animation: gallery-harness-breathe 2.4s ease-in-out infinite alternate;
          animation-delay: calc(var(--rf-scene-start, 0s) + 1.2s);
        }

        #gallery-harness-s01 .copy {
          position: relative;
          margin: 0;
          font-size: clamp(76px, 8vw, 164px);
          font-weight: 800;
          letter-spacing: -0.065em;
          line-height: 1.12;
          text-align: center;
        }

        @keyframes gallery-harness-breathe {
          from {
            filter: blur(120px) brightness(0.88);
            opacity: 0.32;
          }
          to {
            filter: blur(120px) brightness(1.14);
            opacity: 0.52;
          }
        }
      </style>
      <main
        id="gallery-harness-s01"
        data-rf-fragment-version="1.0"
        data-composition-id="free-s01"
      >
        <div class="stage"></div>
        <div class="glow"></div>
        <p class="copy">장면은 계속 살아 있다</p>
      </main>
      <script>
        const root = document.querySelector('[data-composition-id="free-s01"]');
        const copy = root.querySelector(".copy");
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        tl.fromTo(
          copy,
          { opacity: 0, y: 28 },
          { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" },
          0
        );

        window.__timelines["free-s01"] = tl;
        tl.seek(0);
      </script>
    </template>
  </body>
</html>
