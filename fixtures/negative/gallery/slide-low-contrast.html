<!--
  Expected gallery-verify rejection: low-contrast (RF-GV-012, not frozen-motion).
  Muted copy is deliberately mixed almost into the muted background, making the frame unreadable.
  A full-width low-contrast gradient panel drifts for the whole duration so the motion check
  passes and the run reaches the contrast check — the fixture must die on RF-GV-012 specifically.
-->
<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Negative fixture — low contrast slide</title>
  </head>
  <body>
    <template>
      <style>
        .negative-low-contrast {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #6e727a !important;
          color: color-mix(in srgb, var(--rf-bg, #6c7076) 82%, var(--rf-text, #767a80) 18%);
          font-family: "Pretendard", system-ui, sans-serif;
        }

        .negative-low-contrast .drift-panel {
          position: absolute;
          top: 0;
          left: -60%;
          width: 220%;
          height: 100%;
          background: linear-gradient(
            105deg,
            #6c7076 0%,
            #74787e 22%,
            #6e727a 41%,
            #73777d 63%,
            #6c7076 82%,
            #71757b 100%
          ) !important;
        }

        .negative-low-contrast .copy {
          position: absolute;
          top: 50%;
          left: 50%;
          width: min(76vw, 1460px);
          transform: translate(-50%, -50%);
          text-align: center;
        }

        .negative-low-contrast .headline {
          color: #75797f !important;
          margin: 0;
          font-size: clamp(90px, 7.6vw, 146px);
          font-weight: 800;
          letter-spacing: -0.065em;
          line-height: 1.08;
        }

        .negative-low-contrast .subtext {
          margin: 34px 0 0;
          color: #73777d !important;
          font-size: clamp(27px, 2vw, 40px);
          font-weight: 600;
          letter-spacing: -0.025em;
          line-height: 1.35;
        }
      </style>
      <main
        class="negative-low-contrast"
        data-rf-fragment-version="1.0"
        data-composition-id="negative-slide-low-contrast"
      >
        <div class="drift-panel" aria-hidden="true"></div>
        <section class="copy">
          <h1 class="headline">보여도 읽히지 않는 메시지</h1>
          <p class="subtext">배경과 글자가 거의 같은 톤으로 섞여 있습니다</p>
        </section>
      </main>
      <script>
        const root = document.querySelector('[data-composition-id="negative-slide-low-contrast"]');
        const copy = root.querySelector(".copy");
        const panel = root.querySelector(".drift-panel");
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        tl.set(copy, { opacity: 0 })
          .to(copy, { opacity: 1, duration: 0.22, ease: "power1.out" }, 0)
          .fromTo(panel, { x: 0 }, { x: 620, duration: 3.4, ease: "none" }, 0);

        window.__timelines["negative-slide-low-contrast"] = tl;
        tl.seek(0);
      </script>
    </template>
  </body>
</html>
